/* v4.6: las hojas traen las indicaciones en trozos con nombre, separados por
   una linea en blanco: "How to run it\n<frase>". Se pinta el nombre en negrita
   y la frase debajo. Un parrafo de tres instrucciones seguidas no lo lee nadie. */
function pintaCue(t){
  return String(t||'').split(/\n{2,}/).map(function(b){
    const ls = b.split('\n').filter(x=>x.trim());
    if(ls.length > 1 && ls[0].length <= 30)
      return `<p><b>${esc(ls[0])}</b><br>${esc(ls.slice(1).join(' '))}</p>`;
    return `<p>${ls.map(esc).join('<br>')}</p>`;   // sin titulo, pero cada linea en la suya
  }).join('');
}

function ejercicio(bl,dia,f){
  const nombre = f['EJERCICIO / ELEMENTO'] || '';
  const series = parseInt(f.SERIES)||0;
  const ficha = fichaEj(nombre);
  const vid = ficha ? idYoutube(ficha['VÍDEO']) : null;
  const cues = f.CUES || (ficha ? ficha.CUES : '') || '';
  /* v4.6: la hoja de un corredor trae ritmos donde la de fuerza trae RIR.
     Un "5:55-6:20/km" no es un RIR y no se le pone esa etiqueta delante; un
     "RPE 3-4" tampoco es un ritmo. Y si el MAIN SET dice lo mismo que la dosis,
     no se escribe dos veces: eso es lo que hacia la pantalla ilegible. */
  const esRitmo = v => /\d\s*:\s*\d|\/\s*km|\bmin\/km\b/i.test(String(v||''));
  const esEsfuerzo = v => /^\s*(rpe|rir|ritmo|pace|effort)\b/i.test(String(v||''));
  /* La etiqueta solo se pone cuando el valor es un dato pelado ("5:55-6:20/km").
     Si ya es una frase, se deja tal cual: "Ritmo Approximately 5:15/km if the
     effort allows" no lo lee nadie. */
  const etiqueta = (v, et) => { const t = String(v||'').trim();
    if(!t || t==='—') return '';
    if(!et || esEsfuerzo(t) || t.length > 24) return t;
    // Si el valor ya empieza por la propia etiqueta, no se repite:
    // "Descanso descanso igual" no lo escribe nadie a proposito.
    if(norm(t).startsWith(norm(et))) return t;
    // "RIR" solo delante de un numero. Un "fuerte" o un "pesado" no es un RIR,
    // y un "95 % de tu VAM" tampoco (v5.0).
    if(norm(et)==='rir' && (!/^\d/.test(t) || /%/.test(t))) return t;
    return et+' '+t; };
  const dosis = f['REPS / DOSIS']||'', main = f['MAIN SET']||'';
  const mismo = norm(main) === norm(dosis);
  const extra = [f.KM?'KM '+f.KM:'', mismo?'':main,
    etiqueta(f['PACE / RPE'], esRitmo(f['PACE / RPE'])?tr('Ritmo'):''),
    f.FUEL?'Fuel: '+f.FUEL:''].filter(Boolean).join(' · ');
  const ds = [series?series+' × '+dosis:dosis,
    etiqueta(f['RIR / RPE'], esRitmo(f['RIR / RPE'])?tr('Ritmo'):'RIR'),
    etiqueta(f.TEMPO, 'Tempo'), etiqueta(f.DESCANSO, tr('Descanso'))].filter(Boolean).join(' · ');
  const eid = slug(nombre);
  recordarNombre(idNota(bl,dia,nombre), nombre);

  /* v5.4: mirando otra semana se ve la tarjeta entera (nombre, dosis,
     indicaciones y el buscador de vídeo) y NADA que escriba: ni casillas, ni
     series, ni nota, ni "no lo he hecho". */
  if(soloLectura()){
    const vid2 = ficha ? idYoutube(ficha['VÍDEO']) : null;
    return `<div class="ej">
      <div class="h"><div><div class="nm">${esc(nombre)}</div>${ds?`<div class="ds">${esc(conVAM(ds))}</div>`:''}
        ${extra?`<div class="ds">${esc(extra)}</div>`:''}</div></div>
      ${cues?`<div class="cue">${pintaCue(conVAM(cues))}</div>`:''}
      ${!vid2 && (series || camposDe(f).length) && ['running','evento','descanso','info'].indexOf(norm(f.TIPO))<0
        ? `<a class="verej" href="${esc(buscarYoutube(nombre))}" target="_blank" rel="noopener">🔎 ${tocar(tr("Ver cómo se hace"))}</a>`
        : ''}</div>`;
  }

  const campos = camposDe(f);
  let registro = '';
  if(campos.length && !saltado(bl,dia,nombre)){
    const rid = idReg(bl,dia,nombre);
    recordarNombre(rid, nombre);
    const v = LOG[rid] || {}, d = v.d || {}, cs = campos.join('-');
    registro = `<div class="reg ${v.ok?'ok':''}" id="reg_${rid}">
      ${esCorrer(f) && series>1 ? `<div class="totales">${tr('Totales de la sesión')}</div>` : ''}
      ${campos.map(k=>casilla(rid, k, d, cs, nombre)).join('')}
      ${campos.indexOf('km')>-1 && campos.indexOf('tiempo')>-1
        ? `<div class="ritmo" id="ritmo_${rid}">${esc(ritmoDe(d).replace('Ritmo', tr('Ritmo')))}</div>` : ''}
      ${campos.indexOf('vam')>-1 ? `<div class="ritmo" id="vam_${rid}">${esc(textoVAM(d.vam))}</div>` : ''}
      <button id="rb_${rid}" onclick="confirmarReg('${rid}','${cs}')">${tr(v.ok?'Hecha':'Anotar')}</button>
    </div>`;
  }

  let sets = '';
  if(saltado(bl,dia,nombre)){ sets = ''; registro = ''; }
  else if(campos.length ? (esCorrer(f) && series>1) : (corrPorTiempo(f) && series>0)){
    /* v5.2: una carrera no se anota con kilos. Si son series o cuestas,
       cada una tiene su fila (tiempo y esfuerzo) y los totales van debajo;
       plegado, porque la mayoria de dias solo hace falta el total. */
    sets = setsCorre(bl, dia, nombre, series, campos.length>0);
  }
  else if(series>0 && !campos.length){
    sets = `<div class="sets">${Array.from({length:series},(_,i)=>{
      const id = idSerie(bl,dia,nombre,i);
      recordarNombre(id, nombre);
      const v = LOG[id] || {};
      return `<div class="set ${v.ok?'ok':''} ${v.sent?'sent':''}" id="fila_${id}">
        <span class="i">${i+1}</span>
        <input inputmode="numeric" placeholder="reps" value="${esc(v.r||'')}" id="r_${id}"
          oninput="anota('${id}')" aria-label="Repeticiones serie ${i+1} de ${esc(nombre)}">
        <input inputmode="decimal" placeholder="kg" value="${esc(v.c||'')}" id="c_${id}"
          oninput="anota('${id}')" aria-label="Carga serie ${i+1}">
        <input inputmode="numeric" placeholder="RIR" value="${esc(v.rir||'')}" id="i_${id}"
          oninput="anota('${id}')" aria-label="RIR serie ${i+1}">
        <button id="b_${id}" onclick="confirmar('${id}')">${tr(v.ok?'Hecha':'Anotar')}</button>
        <button class="x" onclick="vaciar('${id}')" aria-label="${tr('Vaciar')} ${tr('serie')} ${i+1}" title="${tr('Vaciar')}">✕</button>
      </div>`;}).join('')}</div>`;
  }

  return `<div class="ej">
    <div class="h"><div><div class="nm">${esc(nombre)}</div>${ds?`<div class="ds">${esc(conVAM(ds))}</div>`:''}
      ${extra?`<div class="ds">${esc(extra)}</div>`:''}</div></div>
    ${lineaUltima(campos.length ? ultimaVezReg(bl,dia,nombre) : (series>0 ? ultimaVez(bl,dia,nombre) : null))}
    ${cues?`<div class="cue">${pintaCue(conVAM(cues))}</div>`:''}
    ${(series || campos.length) ? (function(){
      const idn = idNota(bl,dia,nombre); const txt = textoNota(idn);
      const ab = S.nota===idn || !!txt;
      return `<div class="notaej">
        ${ab?'':`<button class="abrir" onclick="abrirNota('${idn}')">💬 ${tocar(tr("¿Algo que contarme de este ejercicio?"))}</button>`}
        ${bloqueVideo(bl,dia,nombre,f)}${bloqueFoto(bl,dia,nombre,f)}
        ${ab?`<button class="abrir con" onclick="cerrarNota()">💬 ${tr("Tu nota para Salva")}</button>
          <textarea id="n_${idn}" oninput="guardaNota('${idn}',this.value)"
            placeholder="${tr("Dudas, sensaciones, si te ha gustado o no, molestias, la máquina estaba ocupada…")}">${esc(txt)}</textarea>
          <p class="pista">${tr("Se envía junto con la sesión. Salva lo ve con el nombre del ejercicio.")}</p>`:''}
      </div>`;
    })() : ''}
    ${vid ? (S.video===eid
      ? `<div class="vid"><iframe src="https://www.youtube.com/embed/${esc(vid)}?rel=0&modestbranding=1"
           title="${esc(nombre)}" allow="accelerometer; encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>
         <button class="verej" onclick="verVideo(null)">${tr("Ocultar vídeo")}</button>`
      : `<button class="verej" onclick="verVideo('${eid}')">▶ ${tocar(tr("Ver ejercicio"))}</button>`)
      : ((series>0 || campos.length) && ['running','evento','descanso','info'].indexOf(norm(f.TIPO))<0
        ? `<a class="verej" href="${esc(buscarYoutube(nombre))}" target="_blank" rel="noopener">🔎 ${tocar(tr("Ver cómo se hace"))}</a>`
        : '')}
    ${/* v4.8: antes esto se decidia por el TIPO, y solo valia "fuerza" e
         "hibrido". Pero un face pull marcado como "extra" sigue siendo un
         ejercicio, y a Sergio se le quedaban nueve sin el buscador. Lo que
         decide no es la etiqueta: es si hay SERIES que hacer. */''}
    ${sets}${registro}
    ${(function(){
      if(!(series>0 || campos.length)) return '';
      const sal = saltado(bl,dia,nombre);
      return sal
        ? `<div class="saltado">⊘ ${tr("No lo has hecho.")}
             <button onclick="quitaSalto('${esc(bl)}','${esc(dia)}','${esc(nombre)}')">${tr("Deshacer")}</button></div>`
        : `<div class="nohecho"><button onclick="salta('${esc(bl)}','${esc(dia)}','${esc(nombre)}')">${tocar(tr("No he hecho este ejercicio"))}</button></div>`;
    })()}</div>`;
}
/* v5.3: varias clientas no sabian que estas lineas eran botones. Ahora lo
   dicen al final de la frase, y en verde. */
const tocar = t => t + ' <span class="tocar">' + tr('toca aquí') + '</span>';

function verVideo(id){ S.video = id; pinta(); }

/* Marcar un ejercicio como no hecho. Va a la hoja como "omitida" con el
   nombre del ejercicio, asi Salvador ve exactamente cual se salto. */
function salta(bl, dia, ej){
  LOG[idSalto(bl,dia,ej)] = {salto:true, ok:true, ts:new Date().toISOString()};
  LS.set('log', LOG); toast(tr("Anotado: este no lo has hecho.")); pinta();
}
function quitaSalto(bl, dia, ej){
  const id = idSalto(bl,dia,ej), v = LOG[id] || {};
  if(v.sent) LOG[id] = Object.assign({}, v, {ok:false, borrada:true, corregido:true});
  else delete LOG[id];
  LS.set('log', LOG); pinta();
}

/* v3.18: mientras Salvador no tenga grabado su vídeo del ejercicio, el
   boton lleva a una busqueda en YouTube con el nombre del ejercicio ya
   escrito. Asi nadie tiene que copiar el nombre y buscarlo a mano.
   En cuanto haya vídeo propio en la pestaña EJERCICIOS, manda el suyo. */
function buscarYoutube(nombre){
  const limpio = String(nombre||'').replace(/\([^)]*\)/g,' ')   // quita "(o prensa)"
                                   .replace(/[\/→>|]+/g,' ')
                                   .replace(/\s+/g,' ').trim();
  return 'https://www.youtube.com/results?search_query=' +
         encodeURIComponent(limpio + ' ' + tr('técnica'));
}

/* ---------- vídeos de técnica ----------
   El botón solo sale si el puente del cliente ya sabe recibirlos (S.d.VIDEO).
   Se manda uno por ejercicio y sesión: el nuevo sustituye al anterior. */
/* v3.20: la foto del reloj solo tiene sentido en una carrera de verdad:
   una tirada, un rodaje, unos intervalos. No en el core, la movilidad o el
   enfriamiento que van dentro de una sesion de running, y no en los
   hibridos tipo HYROX: de los 400 m entre estacion y estacion el reloj no
   dice nada que sirva. En hibrido solo pasa la fila que es en si una
   carrera (un "run-walk largo"), no las rondas ni el formato. */
const CARRERA_NO = /core|diafragma|plancha|movilidad|respiraci|estiramiento|tecnica|fuerza|meta|foco|enfriamiento|calentamiento/;
const CARRERA_SI = /\b(run|carrera|rodaje|trote|maraton|tirada|correr)/;
const esCarrera = f => {
  if(!f) return false;
  const n = norm(f['EJERCICIO / ELEMENTO']);
  if(CARRERA_NO.test(n)) return false;
  if(!String(f['REPS / DOSIS'] || f.KM || f['MAIN SET'] || '').trim()) return false;   // fila informativa
  const t = norm(f.TIPO);
  if(t === 'running') return true;
  if(t === 'hibrido') return CARRERA_SI.test(n);
  return false;
};

/* Una foto del reloj al terminar: es la forma mas rapida de que quede el
   dato real (ritmo, distancia, tiempo) sin copiarlo a mano. */
function bloqueFoto(bl, dia, nombre, f){
  if(!S.d || !S.d.VIDEO) return '';
  if(!esCarrera(f)) return '';
  const id = idFoto(bl, dia, nombre);
  const v = VID[id] || {};
  const serv = (S.d.MIS_VIDEOS||[]).find(x=>String(x.ID)===id) || {};
  const hecha = v.estado === 'enviado' || !!serv.ID;
  return `<input type="file" accept="image/*" id="vf_${id}" style="display:none"
      onchange="subirVideo('${id}','${esc(bl)}','${esc(dia)}',this)">
    ${v.estado === 'enviando'
      ? `<p class="pista">⏳ ${tr("Enviando la foto…")}</p>`
      : `<button class="abrir" onclick="document.getElementById('vf_${id}').click()">📸 ${
          tocar(hecha ? tr("Mandar otra foto") : tr("Hazle una foto a tu reloj al terminar y mándamela"))}</button>`}
    ${hecha && v.estado !== 'enviando' ? `<p class="pista">✅ ${tr("Foto enviada")}${v.fecha?' · '+esc(v.fecha):''}</p>` : ''}
    ${serv.RESPUESTA ? `<div class="calent" style="margin:6px 0"><b>${tr("Lo que te dice Salva")}.</b> ${esc(serv.RESPUESTA)}</div>` : ''}`;
}

function bloqueVideo(bl, dia, nombre, f){
  if(!S.d || !S.d.VIDEO) return '';
  /* v4.7: en una sesion de carrera no se pide video. Nadie se graba a si mismo
     en mitad de una tirada de 22 km, y ahi lo util es la foto del reloj, que va
     aparte. El video es para la tecnica de los ejercicios. */
  if(norm(f.TIPO) === 'running') return '';
  const id = idVideo(bl, dia, nombre);
  const v = VID[id] || {};
  const serv = (S.d.MIS_VIDEOS||[]).find(x=>String(x.ID)===id) || {};
  const enviado = v.estado === 'enviado' || !!serv.ID;
  const aviso = tr("Máximo 20 segundos: los vídeos largos no llegan a enviarse. Puedes grabarlo ahora o subir uno que ya tengas. No hace falta la serie entera, solo un par de repeticiones lo mejor que puedas. Si puedes, recorta el vídeo hasta justo antes de empezar: así entran más repeticiones y lo veo mejor.");
  return `<div class="video">
    <input type="file" accept="video/*" id="vf_${id}" style="display:none"
      onchange="subirVideo('${id}','${esc(bl)}','${esc(dia)}',this)">
    ${v.estado === 'enviando'
      ? `<p class="pista">⏳ ${tr("Enviando el vídeo…")}</p>`
      : `<button class="abrir" onclick="avisoVideo('${id}')">📹 ${tocar(enviado ? tr("Grabar otro") : tr("¿No sabes si lo estás haciendo bien? Grábate haciéndolo"))}</button>
         ${S.videoAviso === id ? `<div class="calent" style="margin:6px 0">${esc(aviso)}</div>
           <div class="stack" style="margin:0 0 10px;gap:8px">
             <button class="btn sm2 pri" onclick="document.getElementById('vf_${id}').click()">${tr("Grabar o elegir vídeo")}</button>
             <button class="btn sm2" onclick="avisoVideo('${id}')">${tr("Ahora no")}</button></div>` : ''}`}
    ${enviado && v.estado !== 'enviando' ? `<p class="pista">✅ ${tr("Vídeo enviado")}${v.fecha?' · '+esc(v.fecha):''}</p>` : ''}
    ${serv.RESPUESTA ? `<div class="calent" style="margin:6px 0"><b>${tr("Lo que te dice Salva")}.</b> ${esc(serv.RESPUESTA)}</div>` : ''}
  </div>`;
}

function avisoVideo(id){ S.videoAviso = (S.videoAviso === id) ? null : id; pinta(); }

async function subirVideo(id, bl, dia, input){
  S.videoAviso = null;
  const f = input.files && input.files[0];
  input.value = '';
  if(!f) return;
  const esFoto = id.endsWith('~foto');
  if(f.size > (esFoto ? 12 : 45) * 1024 * 1024){
    toast(esFoto ? tr("Esa foto pesa demasiado.") : tr("Ese vídeo pesa demasiado. Graba uno más corto.")); return; }
  if(!esFoto){
    const dur = await duracion(f);
    if(dur && dur > 30){ toast(tr("Ese vídeo es muy largo. Recórtalo a 20 segundos o menos.")); return; }
  }
  const nombre = nombreDe(id.replace(/~(vid|foto)$/,'')) || (id.split('~')[3]||'').replace(/-/g,' ');
  VID[id] = {estado:'enviando'}; LS.set('videos', VID); pinta();
  try{
    const datos = await new Promise((ok, fail)=>{
      const r = new FileReader();
      r.onload = ()=>ok(String(r.result).split(',')[1]);
      r.onerror = fail;
      r.readAsDataURL(f);
    });
    const meta = diasDeBloque(bl).find(x=>norm(x['DÍA'])===norm(dia)) || {};
    const r = await fetch(API, {method:'POST', redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({cliente:CID, token:KEY, video:{
        id: id, fecha: hoyISO(), semana: (S.semana&&S.semana.SEMANA)||'', dia: dia,
        sesion: meta['SESIÓN']||'', ejercicio: nombre, nota: textoNota(idNota(bl,dia,nombre))||'',
        mime: f.type || (esFoto?'image/jpeg':'video/mp4'),
        nombre: f.name || (esFoto?'foto.jpg':'video.mp4'), datos: datos}})});
    const d = await r.json();
    if(d.error) throw new Error(d.error);
    VID[id] = {estado:'enviado', fecha: hoyISO()};
  }catch(e){
    VID[id] = {estado:'error'};
    toast(esFoto ? tr("No se ha podido enviar la foto. Inténtalo otra vez con cobertura.")
                 : tr("No se ha podido enviar el vídeo. Inténtalo otra vez con cobertura."));
  }
  LS.set('videos', VID); pinta();
}

function duracion(f){
  // Si el movil tarda o el archivo es raro, no se espera para siempre: a los 4 s se sigue.
  return new Promise(ok=>{
    let hecho = false;
    const fin = d => { if(!hecho){ hecho = true; ok(d); } };
    setTimeout(()=>fin(0), 4000);
    try{
      const v = document.createElement('video');
      v.preload = 'metadata';
      v.onloadedmetadata = ()=>{ const d = v.duration||0; URL.revokeObjectURL(v.src); fin(d); };
      v.onerror = ()=>fin(0);
      v.src = URL.createObjectURL(f);
    }catch(e){ fin(0); }
  });
}

/* --- guardado automático: NO redibuja la pantalla --- */
function anota(id){
  const r=document.getElementById('r_'+id), c=document.getElementById('c_'+id), i=document.getElementById('i_'+id);
  const prev = LOG[id] || {};
  LOG[id] = Object.assign({}, prev, {r:r.value.trim(), c:c.value.trim(), rir:i.value.trim()});
  if(prev.sent) LOG[id].corregido = true;      // ya estaba en la hoja: al enviar se actualizará
  LS.set('log', LOG);
  const fila = document.getElementById('fila_'+id);
  if(fila && LOG[id].corregido) fila.classList.add('corr');
}

/* --- confirmar / desmarcar una serie, sin tocar el resto --- */
function confirmar(id){
  const r=document.getElementById('r_'+id);
  const v = LOG[id] || {};
  if(v.ok){                                   // desmarcar
    LOG[id] = Object.assign({}, v, {ok:false});
  } else {
    if(!r.value.trim()){ toast(tr('Escribe al menos las repeticiones que hiciste.')); r.focus(); return; }
    anota(id);
    LOG[id].ok = true;
    LOG[id].ts = new Date().toISOString();
  }
  LS.set('log', LOG);
  const fila=document.getElementById('fila_'+id), btn=document.getElementById('b_'+id);
  if(fila) fila.classList.toggle('ok', !!LOG[id].ok);
  if(btn) btn.textContent = tr(LOG[id].ok ? 'Hecha' : 'Anotar');
}

function vaciar(id){
  const v = LOG[id] || {};
  ['r_','c_','i_'].forEach(p=>{ const el=document.getElementById(p+id); if(el) el.value=''; });
  if(v.sent){
    // ya está en la hoja: se envía vacía para que allí quede corregida
    LOG[id] = {r:'', c:'', rir:'', ok:false, sent:true, corregido:true, borrada:true};
    toast(tr('Se corregirá en la hoja al enviar.'));
  } else {
    delete LOG[id];
  }
  LS.set('log', LOG);
  const fila=document.getElementById('fila_'+id), btn=document.getElementById('b_'+id);
  if(fila){ fila.classList.remove('ok'); if(LOG[id]) fila.classList.add('corr'); }
  if(btn) btn.textContent='Anotar';
}

function abrirNota(id){ S.nota=id; pinta();
  setTimeout(()=>{ const el=document.getElementById('n_'+id); if(el) el.focus(); },50); }
function cerrarNota(){ S.nota=null; pinta(); }
function guardaNota(id,txt){
  const prev = LOG[id]||{};
  if(!txt.trim() && !prev.sent){ delete LOG[id]; LS.set('log',LOG); return; }
  LOG[id] = Object.assign({}, prev, {nota:txt, ok:!!txt.trim()});
  if(prev.sent) LOG[id].corregido = true;
  LS.set('log', LOG);
}

function anotaReg(id, cs){
  /* v5.2: se parte de lo que ya habia. Las escalas se pintan con botones,
     no con casillas, y antes se perdian al escribir en cualquier otra. */
  const prev = LOG[id] || {}, d = Object.assign({}, prev.d || {});
  cs.split('-').forEach(k=>{ const el=document.getElementById('g_'+id+'_'+k); if(el) d[k]=el.value.trim(); });
  LOG[id] = Object.assign({}, prev, {d:d});
  if(prev.sent) LOG[id].corregido = true;
  LS.set('log', LOG);
  const r = document.getElementById('ritmo_'+id);
  if(r) r.textContent = ritmoDe(d).replace('Ritmo', tr('Ritmo'));
  const va = document.getElementById('vam_'+id);
  if(va) va.textContent = textoVAM(d.vam);
}
/* Escala de botones: tocar el mismo numero lo quita, como las estrellas. */
function anotaEscala(id, k, n){
  const prev = LOG[id] || {}, d = Object.assign({}, prev.d || {});
  d[k] = (String(d[k]||'') === String(n)) ? '' : String(n);
  LOG[id] = Object.assign({}, prev, {d:d});
  if(prev.sent) LOG[id].corregido = true;
  LS.set('log', LOG);
  const C = CAMPOS[k] || {};
  for(let i=1;i<=(C.escala||5);i++){
    const b = document.getElementById('eb_'+id+'_'+k+'_'+i);
    if(b) b.classList.toggle('on', String(d[k]) === String(i));
  }
}
function confirmarReg(id, cs){
  const v = LOG[id] || {};
  if(v.ok){
    LOG[id] = Object.assign({}, v, {ok:false});
  } else {
    anotaReg(id, cs);
    const d = LOG[id].d || {};
    if(!Object.keys(d).some(k=>d[k])){ toast(tr('Anota al menos un dato antes de confirmar.')); return; }
    LOG[id].ok = true;
    LOG[id].ts = new Date().toISOString();
  }
  LS.set('log', LOG);
  const caja=document.getElementById('reg_'+id), btn=document.getElementById('rb_'+id);
  if(caja) caja.classList.toggle('ok', !!LOG[id].ok);
  if(btn) btn.textContent = tr(LOG[id].ok ? 'Hecha' : 'Anotar');
  // v5.0: con la VAM confirmada, las series de abajo ya salen con su velocidad
  if(LOG[id].d && LOG[id].d.vam) pinta();
}
function valora(bl,dia,n){
  const id = idVal(bl,dia), prev = LOG[id] || {};
  const nuevo = (prev.val===n) ? 0 : n;      // tocar la misma estrella la quita
  LOG[id] = Object.assign({}, prev, {val:nuevo, ok:nuevo>0});
  if(prev.sent) LOG[id].corregido = true;
  LS.set('log', LOG);
  for(let i=1;i<=5;i++){
    const b=document.getElementById('est_'+id+'_'+i);
    if(b) b.classList.toggle('on', i<=nuevo);
  }
}
function guardaObs(bl,dia,txt){
  const id = idObs(bl,dia);
  const prev = LOG[id]||{};
  LOG[id] = Object.assign({}, prev, {obs:txt, ok:!!txt.trim()});
  if(prev.sent) LOG[id].corregido = true;
  LS.set('log', LOG);
}
function omitir(bl,dia){
  LOG[idOmit(bl,dia)] = {ok:true, ts:new Date().toISOString()};
  LS.set('log', LOG); pinta();
  toast(tr('Marcada como omitida. Es distinto de no haberla anotado.'));
}
function desomitir(bl,dia){
  const id = idOmit(bl,dia);
  if(LOG[id] && LOG[id].sent) LOG[id] = {ok:false, sent:true, corregido:true, borrada:true};
  else delete LOG[id];
  LS.set('log', LOG); pinta();
}
/* ================= ENVÍO ================= */
async function enviar(){
  if(S.enviando) return;
  const reg = [], hoy = new Date().toISOString().slice(0,10);

  Object.keys(LOG).forEach(id=>{
    const v = LOG[id]; if(!v) return;
    // solo se manda lo confirmado, lo corregido o lo borrado
    if(id.endsWith('~fecha')) return;      // marca interna: no es un registro
    if(!v.ok && !v.corregido) return;
    if(v.sent && !v.corregido) return;

    const p = id.split('~');
    const base = {id:id, fecha:(v.ts||'').slice(0,10)||hoy,
                  semana:(p[0]||'').replace(/^s/,''), bloque:p[1]||'', dia:p[2]||'',
                  sesion:'', ejercicio:'', serie:'', reps:'', carga:'', rir:'', notas:'', estado:'',
                  km:'', tiempo:'', ritmo:'', rpe:'', piernas:'', valoracion:''};

    if(id.endsWith('~omitida')){ reg.push(Object.assign(base,{estado:v.borrada?'':'omitida'})); return; }
    if(id.endsWith('~extra')){
      const e = v.extra || {};
      reg.push(Object.assign(base,{ejercicio:'EXTRA · ' + (e.titulo||''),
        tiempo: e.min ? e.min + ' min' : '', rpe: e.int ? String(e.int) : '',
        notas: e.nota || '', estado: v.borrada ? '' : 'realizada'}));
      return;
    }
    if(id.endsWith('~salto')){
      reg.push(Object.assign(base,{ejercicio:nombreDe(id)||p[3]||'', estado:v.borrada?'':'omitida'}));
      return;
    }
    if(id.endsWith('~obs')){ reg.push(Object.assign(base,{ejercicio:'OBSERVACIONES', notas:v.obs||''})); return; }
    if(id.endsWith('~nota')){
      reg.push(Object.assign(base,{ejercicio:nombreDe(id)||p[3]||'', notas:v.nota||'', estado:'nota'}));
      return;
    }
    if(id.endsWith('~valoracion')){
      reg.push(Object.assign(base,{ejercicio:'VALORACIÓN DEL DÍA',
        valoracion: v.val ? String(v.val) : '', estado: v.val ? 'valorada' : ''}));
      return;
    }
    if(id.endsWith('~reg')){
      const d = v.d || {};
      reg.push(Object.assign(base,{ejercicio:nombreDe(id)||p[3]||'',
        km:d.km||'', tiempo:d.tiempo||'',
        /* v5.2: si lo escribio ella (con su unidad), manda lo suyo; si no, el
           ritmo que sale de km y tiempo. El avituallamiento va en notas: la
           hoja no tiene columna propia y asi Salvador lo lee con el resto. */
        notas: d.fuel ? tr('Avituallamiento') + ': ' + d.fuel : '',
        ritmo: d.vam ? 'VAM' + (vamDe(d.vam) ? ' ' + paso(vamDe(d.vam)) + ' min/km' : '')
                     : (d.ritmo || ritmoDe(d).replace('Ritmo ','')),
        rpe:d.rpe||'', piernas:d.piernas||'', carga:d.carga||'', reps:d.metros||d.vam||'',
        estado: v.borrada ? '' : (v.ok?'realizada':'')}));
      return;
    }

    const serie = (p[4]||'').replace('s','');
    // Una serie de fuerza trae reps, kilos y RIR; una de carrera, tiempo y esfuerzo.
    reg.push(Object.assign(base,{ejercicio:nombreDe(id)||p[3]||'', serie:serie, reps:v.r||'', carga:v.c||'',
      rir:v.rir||'', tiempo:v.t||'', rpe:v.e||'', estado: v.borrada ? '' : (v.ok?'realizada':'')}));
  });

  // La semana que se está respondiendo es la que pide el aviso; si no hay
  // aviso pendiente, es la actual. Tiene que ser la misma en las tres partes:
  // el identificador, el dato que va a la hoja y la marca de "ya respondida".
  const semResp = (faltaCheckin() || S.semana || {}).SEMANA || '0';
  const chk = Object.keys(CHK).filter(k=>CHK[k] && (String(CHK[k].v||'').trim() || CHK[k].n)).map(k=>({
    id: idChk(semResp, k),
    fecha: hoy, semana: semResp, 'npregunta': k,
    categoria: CHK[k].cat||'',
    respuesta: (CHK[k].n ? CHK[k].n + '/5' + (String(CHK[k].v||'').trim() ? ' · ' : '') : '') + (CHK[k].v||'')
  }));

  if(!reg.length && !chk.length){ toast(tr('No hay nada nuevo que enviar.')); return; }

  S.enviando = true; toast(tr('Enviando…'));
  try{
    const r = await fetch(API, {method:'POST', redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({cliente:CID, token:KEY, registro:reg, checkin:chk})});
    const d = await r.json();
    if(d.error) throw new Error(d.error);

    // se conserva todo, marcado como enviado: así se puede corregir después
    Object.keys(LOG).forEach(id=>{
      const v = LOG[id]; if(!v) return;
      if(v.borrada){ delete LOG[id]; return; }
      if(v.ok || v.corregido){ v.sent = true; delete v.corregido; }
    });
    LS.set('log', LOG);

    if(chk.length && !ENVIADO.includes(String(semResp))){
      ENVIADO.push(String(semResp)); LS.set('semanas_enviadas', ENVIADO);
    }
    CHK = {}; LS.set('checkin', CHK);   // el formulario queda limpio para la semana siguiente
    S.enviando=false; S.vista='hoy'; pinta();
    const c = d.corregidas||0;
    toast(c ? `${tr('Enviado.')} ${c} ${tr(c>1?'datos corregidos.':'dato corregido.')}` : tr('Enviado. Salvador ya lo tiene.'));
  }catch(e){
    S.enviando=false;
    toast(tr('No se ha podido enviar. Sigue guardado en tu móvil; inténtalo luego.'));
  }
}

/* ================= PROGRESO ================= */
function vProgreso(){
  const bl = bloqueDe(S.semana);
  const dias = sesionesContables(bl);
  const hechas = dias.filter(d=>['hecha','parcial'].includes(estadoSesion(bl,d['DÍA']))).length;
  const pct = dias.length ? Math.round(hechas/dias.length*100) : 0;
  const totalSem = (S.d.SEMANAS||[]).length;
  const semN = parseInt(String((S.semana||{}).SEMANA||'0').replace(/\D/g,'')) || 0;
  const pctPrg = totalSem ? Math.round(semN/totalSem*100) : 0;

  /* v3.14: el historial sale de todas las semanas, no solo de esta.
     Ahora se puede, porque cada semana tiene su propio identificador. */
  const porEj = {}, sesiones = {};
  let series = 0;
  Object.keys(LOG).forEach(k=>{
    const v = LOG[k]; if(!v || !v.ok || v.borrada) return;
    const p = k.split('~'); if(p.length !== 5 || !/^s\d+$/.test(p[4])) return;
    if(!v.r && !v.c && !v.t && !v.e) return;
    series++;
    sesiones[p[0]+'~'+p[1]+'~'+p[2]] = true;
    if(!v.r && !v.c) return;                 // serie de carrera: cuenta, pero no es una carga
    const it = {sem:parseInt(p[0].replace(/^s/,''))||0, c:parseFloat(String(v.c||'').replace(',','.'))||0,
                carga:v.c||'', reps:v.r||''};
    const e = porEj[p[3]] = porEj[p[3]] || {n:0, prim:null, mejor:null};
    e.n++;
    if(!e.prim || it.sem < e.prim.sem) e.prim = it;
    if(!e.mejor || it.c > e.mejor.c || (it.c === e.mejor.c && (parseFloat(it.reps)||0) > (parseFloat(e.mejor.reps)||0))) e.mejor = it;
  });
  // El nombre bonito lo tiene la hoja; el identificador va sin acentos.
  const nombres = {};
  (S.d.SESIONES||[]).forEach(f=>{ const n=f['EJERCICIO / ELEMENTO']; if(n) nombres[slug(n)] = n; });
  const nSes = Object.keys(sesiones).length;
  const vids = (S.d.MIS_VIDEOS||[]).length;
  const hayAlgo = series > 0 || nSes > 0;

  /* v5.2: quien solo corre no veia nada suyo aqui. Su progreso no son las
     cargas: son los kilometros, el tiempo en pie y el ritmo que le sale. */
  const blSlug = slug(bl||'');
  let kmSem=0, kmBl=0, sgSem=0, sgBl=0, carrSem=0, carrBl=0, masLarga=0;
  Object.keys(LOG).forEach(k=>{
    const v = LOG[k];
    if(!v || !v.ok || v.borrada || !k.endsWith('~reg')) return;
    const d = v.d || {};
    const km = parseFloat(String(d.km||'').replace(',','.')) || 0;
    const sg = aSegundos(d.tiempo);
    if(!km && !sg) return;
    const p = k.split('~');
    if(km > masLarga) masLarga = km;
    if(p[1] === blSlug){ kmBl+=km; sgBl+=sg; carrBl++; }
    if(p[0] === SEM()){ kmSem+=km; sgSem+=sg; carrSem++; }
  });
  const unKm = n => (Math.round(n*10)/10).toString().replace('.', enIngles()?'.':',');
  const enHoras = sg => sg>=3600 ? Math.floor(sg/3600)+' h '+String(Math.round(sg%3600/60)).padStart(2,'0')+' min'
                                 : Math.round(sg/60)+' min';
  const ritmoMedio = (km, sg) => { if(!km || !sg) return ''; const s=Math.round(sg/km);
    return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')+' '+tr('min/km'); };
  const hayCarrera = kmBl>0 || sgBl>0;
  const tarjetaKm = hayCarrera ? `<div class="card"><h3 style="margin-bottom:10px">${tr("Tus kilómetros")}</h3>
    <div class="row sp"><span class="sm">${tr("Esta semana")}</span>
      <b class="mono">${kmSem?unKm(kmSem)+' km':enHoras(sgSem)}</b></div>
    <div class="row sp" style="margin-top:6px"><span class="sm">${tr("En este bloque")}</span>
      <b class="mono">${kmBl?unKm(kmBl)+' km':enHoras(sgBl)}</b></div>
    ${sgBl?`<div class="row sp" style="margin-top:6px"><span class="sm">${tr("Tiempo corriendo en el bloque")}</span>
      <b class="mono">${enHoras(sgBl)}</b></div>`:''}
    ${ritmoMedio(kmBl,sgBl)?`<div class="row sp" style="margin-top:6px"><span class="sm">${tr("Tu ritmo medio")}</span>
      <b class="mono">${ritmoMedio(kmBl,sgBl)}</b></div>`:''}
    ${masLarga?`<div class="row sp" style="margin-top:6px"><span class="sm">${tr("Tu tirada más larga")}</span>
      <b class="mono">${unKm(masLarga)} km</b></div>`:''}
    <p class="sm" style="margin-top:8px">${tr("Sale de lo que anotas en cada carrera. Si un día no lo anotas, ese día no suma.")}</p></div>` : '';

  const vam = miVAM();
  const fechaVAM = vam && vam.ts ? new Date(vam.ts).toLocaleDateString(enIngles()?'en-GB':'es-ES',
                     {day:'numeric', month:'short'}) : '';
  const cabecera = `
  ${vam?`<div class="card"><div class="row sp"><h3>${tr("Tu VAM")}</h3><b class="mono">${paso(vam.v)} ${tr('min/km')}</b></div>
    <p class="sm" style="margin-top:6px">${tr("Tu velocidad aeróbica máxima, del Test A")}${fechaVAM?' · '+esc(fechaVAM):''}.
      ${tr("De ella salen tus velocidades: en cada sesión verás la que te toca.")}</p>
    <div class="row sp" style="margin-top:8px"><span class="sm">Z2 (60-70 %)</span>
      <b class="mono">${paso(vam.v*0.6)} - ${paso(vam.v*0.7)}</b></div></div>`:''}
  ${tarjetaKm}
  <div class="card"><div class="lbl">${tr("Tu objetivo")}</div>
    <p style="margin-top:6px;font-size:15.5px;line-height:1.45">${esc(campo('objetivo')||'')}</p></div>
  ${totalSem?`<div class="card"><div class="row sp"><h3>${tr("Tu programa")}</h3>
    <b class="mono">${tr('Semana')} ${semN} / ${totalSem}</b></div>
    <div class="bar"><i style="width:${pctPrg}%"></i></div>
    <p class="sm">${esc(sinRepetir((S.semana||{})['FASE / TÍTULO']||''))}</p></div>`:''}
  <div class="card"><div class="row sp"><h3>${tr("Esta semana")}</h3><b class="mono">${hechas} / ${dias.length}</b></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <p class="sm">${tr("Sesiones registradas frente a las previstas. Lo que no has anotado cuenta como sin registrar, no como fallada.")}</p></div>`;

  if(!hayAlgo && !hayCarrera) return cabecera + `
  <div class="card"><h3>${tr("Aquí vas a ver tu progreso")}</h3>
    <p class="mut" style="margin-top:8px">${tr("Ahora está vacío, y es normal: esto se llena solo, con lo que vas anotando mientras entrenas.")}</p>
    <p class="mut" style="margin-top:8px">${tr("Anota las series según las haces, aunque sea rápido y a ojo. Con dos semanas ya veo por dónde vas y puedo ajustarte el plan.")}</p>
    <p class="mut" style="margin-top:8px"><b>${tr("No busques el número perfecto. Busca no fallar.")}</b></p>
    <button class="btn pri big" style="margin-top:14px" onclick="ir('hoy')">${tr("Ir a lo de hoy")}</button></div>
  <div class="card"><p class="sm">${tr("Sin comparaciones con otras personas y sin premios por entrenar más de lo prescrito.")}</p></div>`;

  const ejs = Object.keys(porEj).sort((a,b)=>porEj[b].n-porEj[a].n);
  return cabecera + `
  <div class="card"><h3 style="margin-bottom:10px">${tr("Lo que llevas")}</h3>
    <div class="row sp"><span class="sm">${tr("Sesiones anotadas")}</span><b class="mono">${nSes}</b></div>
    <div class="row sp" style="margin-top:6px"><span class="sm">${tr("Series anotadas")}</span><b class="mono">${series}</b></div>
    ${vids?`<div class="row sp" style="margin-top:6px"><span class="sm">${tr("Vídeos enviados")}</span><b class="mono">${vids}</b></div>`:''}</div>
  ${ejs.length?`<div class="card"><h3 style="margin-bottom:4px">${tr("Tus cargas")}</h3>
    <p class="sm" style="margin-bottom:8px">${tr("De la primera vez que lo anotaste a tu mejor serie.")}</p>
    ${ejs.map(e=>{
      const x = porEj[e], sube = x.mejor.c - (x.prim.c||0);
      const ini2 = x.prim.carga ? x.prim.carga+' kg × '+x.prim.reps : x.prim.reps+' '+tr('reps');
      const top = x.mejor.carga ? x.mejor.carga+' kg × '+x.mejor.reps : x.mejor.reps+' '+tr('reps');
      const mov = x.prim.sem !== x.mejor.sem && ini2 !== top;
      return `<div class="q"><div class="t"${nombres[e]?'':' style="text-transform:capitalize"'}>${esc(nombres[e] || e.replace(/-/g,' '))}</div>
        <p class="sm mono">${mov?esc(ini2)+' → ':''}<b>${esc(top)}</b>${sube>0&&mov?' · +'+(Math.round(sube*10)/10)+' kg':''}</p>
        <p class="sm">${x.n} ${x.n>1?tr('series anotadas'):tr('serie anotada')}</p></div>`;
    }).join('')}</div>`:''}
  <div class="card"><p class="sm">${tr("Sin comparaciones con otras personas y sin premios por entrenar más de lo prescrito.")}</p></div>`;
}

/* ================= SEGUIMIENTO ================= */
function vSeg(){
  const qs2 = S.d.SEGUIMIENTO||[];
  const ant = faltaCheckin();
  const sem = ant || S.semana;
  const foco = sem ? (sem['NOTA DE LA SEMANA']||'') : '';
  const pregFoco = sem ? (sem['PREGUNTA DE LA SEMANA']||'') : '';
  return `
  <div class="card"><h2 style="font-size:19px">${tr("Seguimiento semanal")}</h2>
    <p class="mut" style="margin-top:8px">${ant?`${tr("Estás respondiendo la")} <b>${tr('semana')} ${esc(ant.SEMANA)}</b>.`:tr("Es lo que me deja ajustar tu plan.")} ${tr("Escribe con libertad.")}</p></div>
  ${foco?`<div class="card"><div class="lbl">${tr("Foco de esa semana")}</div><p class="mut" style="margin-top:6px">${esc(foco)}</p></div>`:''}
  <div class="card">
    ${qs2.map((q,i)=>{
      const clave = 'p'+(q['Nº']||i+1);
      const txt = norm(q.PREGUNTA).includes('cambia cada semana') && (pregFoco||foco) ? (pregFoco||foco) : q.PREGUNTA;
      const cat = q['CATEGORÍA']||'';
      const n = (CHK[clave]||{}).n || 0;
      return `<div class="q"><div class="t"><span class="tag">${esc(cat)}</span></div>
        <div class="t">${esc(txt)}</div>
        ${esEscala(txt)?`<div class="escala">${[1,2,3,4,5].map(x=>
          `<button class="${x===n?'on':''}" onclick="notaQ('${esc(clave)}','${esc(cat)}',${x})"
             aria-label="${x} de 5">${x}</button>`).join('')}</div>
          <p class="sm" style="margin:6px 0 2px">${tr("Y cuéntame lo que quieras, si te apetece.")}</p>`:''}
        <textarea id="q_${esc(clave)}" oninput="respQ('${esc(clave)}','${esc(cat)}',this.value)"
          placeholder="${tr("Tu respuesta")}">${esc((CHK[clave]||{}).v||'')}</textarea></div>`;
    }).join('')}
    <button class="btn pri big" style="margin-top:14px" onclick="enviar()">${tr("Enviar a Salvador")}</button>
    <p class="sm" style="margin-top:10px">${tr("Se guarda mientras escribes. Si pierdes la conexión, no se borra.")}</p>
  </div>`;
}
function respQ(clave,cat,v){ CHK[clave]=Object.assign({},CHK[clave],{v:v,cat:cat}); LS.set('checkin',CHK); }
/* v3.14: las preguntas que piden un numero del 1 al 5 se contestan con un
   boton. Escribir "4" en un cuadro de texto era lento y luego no se podia
   comparar una semana con otra. El cuadro de texto se queda igual, para
   contar lo que quiera. */
/* v4.5: vale "1-5", "1 al 5" y "1 to 5": las hojas en ingles tambien.
   21 sep: y tambien las escalas con sus extremos escritos, "1 = wrecked,
   5 = fully recovered", que es como quedaron tras la v5.2. Sin esto, a Smi
   le desaparecian los botones en tres de sus nueve preguntas. */
const esEscala = t => /\b1\s*(?:[-–—]|\s*(?:al|to|a)\s*)\s*5\b/i.test(String(t||'')) ||
                      /\b1\s*=[^]{1,60}?\b5\s*=/i.test(String(t||''));
function notaQ(clave,cat,n){
  const a = CHK[clave] || {};
  CHK[clave] = Object.assign({}, a, {cat:cat, n: a.n===n ? 0 : n, v: a.v||''});
  LS.set('checkin',CHK); pinta();
}

/* ================= GUÍAS ================= */
function vGuias(){
  const gs = S.d['GUÍAS']||[], grupos = {};
  gs.forEach(g=>{ (grupos[g.CLAVE] = grupos[g.CLAVE] || {t:g['TÍTULO'], filas:[]}).filas.push(g); });
  const textos = (S.d.TEXTOS||[]).filter(t=>!norm(t.CLAVE).startsWith('intro'));
  return `
  <div class="card flat"><button class="btn sm2" onclick="ir('plan')">${tr("← Mi plan")}</button></div>
  ${Object.keys(grupos).map(k=>{
    const g = grupos[k];
    return `<div class="card"><h3 style="margin-bottom:12px">${esc(g.t)}</h3>
      ${g.filas.map(f=>`<div class="guia"><div class="p">${esc(f.PUNTO)}</div>
        <div class="c">${esc(f.CONTENIDO)}</div></div>`).join('')}</div>`;
  }).join('')}
  ${textos.map(t=>`<div class="card"><h3>${esc(t['TÍTULO'])}</h3>
    <p class="mut" style="margin-top:8px">${esc(t.CONTENIDO)}</p></div>`).join('')}`;
}

cargar();

/* Sin cobertura la app tiene que abrir igual: el service worker guarda
   la pagina. Va a la red primero, asi un despliegue nuevo se ve enseguida. */
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
