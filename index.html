/* ---------- de que va la sesion ----------
   Se mira el TIPO de cada fila de la hoja, nunca solo el nombre: fuerza,
   running, hibrido (carrera + estaciones). El calentamiento (ORDEN 0), las
   filas informativas y los extras no cuentan. */
/* v5.12.1: los tests y las medidas ("Medida 3a · Sentadilla a caja", "Test A · 5
   minutos") no son entrenar: ni dan tipo a la sesion ni pintan musculos. Lo vio
   la sesion de Jorge: su dia de llamada salia como FUERZA, con mapa, y su propio
   texto dice "hoy no hay entrenamiento". */
const esTest = f => /^(medida|medidas|test|re-?test|checkpoint|prueba de|las tres medidas)\b/.test(norm(f && f['EJERCICIO / ELEMENTO']))
                    || /\b(test de|re-test de)\b/.test(norm(f && f['EJERCICIO / ELEMENTO']));
const filasSesion = (bl, dia) => sesionDe(bl, dia).filter(f=>parseInt(f.ORDEN)>0 && !esExtra(f)
                                   && ['info','evento','descanso'].indexOf(norm(f.TIPO)) < 0);
/* Paseo o bici: dice andar/bici y NO dice correr. "Run-walk", "Trote o paseo" o
   "Trote-andar final" siguen siendo carrera (regla probada por la sesion de
   Jorge contra las quince hojas: cero fallos). */
const esPaseo = f => { const t = norm(f && f['EJERCICIO / ELEMENTO']);
  return /caminar|caminata|paseo|andar|walk|bici|bike/.test(t) && !/run|jog|corr|trot|carrera|fartlek|intervalo/.test(t); };
const filasTrabajo = (bl, dia) => filasSesion(bl, dia).filter(f=>!esTest(f));
function tipoSesion(bl, dia){
  let fs = filasTrabajo(bl, dia);
  const tests = filasSesion(bl, dia).filter(esTest).length;
  // dia de tests: no hay nada que entrenar, o los tests son la mayor parte (la llamada de Jorge)
  if(tests && tests >= fs.length) return 'test';
  if(!fs.length) return null;
  /* v5.12.1: una fila opcional no decide sola el tipo del dia (el paseo "lo que
     salga" de Jorge convertia su dia de hombro en "Carrera"). Solo cuenta si
     todo lo del dia es opcional. */
  const obligadas = fs.filter(f=>!esOpcional(f));
  if(obligadas.length) fs = obligadas;
  const meta = diasDeBloque(bl).find(x=>norm(x['DÍA'])===norm(dia)) || {};
  const n = {fuerza:0, running:0, hibrido:0, hyrox:0, movilidad:0};
  fs.forEach(f=>{ let t = norm(f.TIPO);
    // caminar o pasear no es correr: no convierte el dia en "Carrera"
    if(t === 'running' && esPaseo(f)) return;
    if(n[t] !== undefined) n[t]++; });
  if(n.hyrox || /hyrox/.test(norm(meta['SESIÓN']))) return 'hyrox';
  if(n.hibrido) return 'hibrido';
  if(n.running > n.fuerza) return 'carrera';
  if(n.fuerza) return 'fuerza';
  if(n.running) return 'carrera';
  return n.movilidad ? 'movilidad' : null;
}

/* ---------- mapa del cuerpo POR SESION ----------
   CRITERIO NUESTRO, sin respaldo en el metodo: que musculos trabaja cada
   ejercicio se deduce de su nombre (en espanol o en ingles), con la lista de
   abajo. Es orientativo, para que la clienta vea de un vistazo el dia que toca.
   Carrera: tren inferior entero. HYROX: cuerpo entero.
   Revisado el 2 oct contra los 502 ejercicios de las quince hojas: lo que no
   casa es carrera, movilidad, cuello o tests, y ahi no se pinta nada. */
const MUSCULOS = [
  ['gluteo', /hip thrust|gluteo|glute|puente|bridge|abduc|kickback|patada|monster|clamshell|almeja|peso muerto|deadlift|rdl|rumano|romanian|sentadilla|squat|zancada|lunge|bulgar|split|step.?up|subida|prensa|leg press|swing|extension de cadera|hip extension|sled|trineo|good morning|hiperextension|frog/],
  ['cuadriceps', /sentadilla|squat|zancada|lunge|bulgar|split|step.?up|subida|prensa|leg press|extension de rodilla|leg extension|extension de cuadriceps|wall ?ball|sled push|thruster|escalon|pistol|sissy|wall sit|salto|jump|pogo|box/],
  ['femoral', /femoral|hamstring|leg curl|nordico|nordic|peso muerto|deadlift|rdl|rumano|romanian|good morning|swing|extension de cadera|hip extension|sled pull/],
  ['gemelo', /talon|calf|gemelo|soleo|tibial|pogo|salto|jump|comba|skipping/],
  ['pecho', /press de banca|banca|bench(?!.supported)|pecho|chest(?!.supported)|flexiones|flexion de brazos|push.?up|aperturas|fly|fondos|\bdip|burpee|press inclinado|incline.{0,12}press|press en maquina|press de suelo/],
  ['hombro', /hombro|shoulder|militar|overhead press|press overhead|elevaci\w* lateral|lateral raise|arnold|face pull|pajaro|reverse pec|rotacion externa|rotacion interna|external rotation|\bt e y\b|\by boca abajo|wall ?ball|landmine|pike|handstand|banda|press por encima|serrato/],
  ['espalda', /remo|row|jalon|pulldown|dominada|pull.?up|chin.?up|face pull|pullover|retraccion|escapular|reverse pec|pajaro|sled pull|farmer|granjero|encogimiento|shrug|skierg|\bski\b|colgarse|\bt e y\b|\by boca abajo/],
  ['brazos', /biceps|triceps|pushdown|fondos|\bdip|press frances|skull|martillo|hammer|farmer|granjero|colgarse/],
  ['core', /core|plancha|plank|dead ?bug|bicho|pallof|crunch|hollow|\boso\b|bear|abdominal|ab wheel|rueda|rollout|bird ?dog|transverso|antirrotacion|anti.?rot|lenador|woodchop|russian|copenhag|v-up|elevacion de piernas|leg raise|farmer|suitcase|maleta|carry|sit.?up|serrato/],
  ['aductor', /aduct|aducc|copenhag/],
  ['lumbar', /peso muerto|deadlift|rdl|rumano|romanian|good morning|hiperextension|back extension|extension lumbar|superman|bird ?dog|swing/]
];
/* Lo que va detras de "paired with", "inside", "junto con"... habla de OTRO
   ejercicio ("Push-ups · paired with the row"): no cuenta para este. */
const limpiaEj = t => norm(t).replace(/\b(paired with|inside|opens|alternando con|alternado con|junto con|emparejad[oa] con|en los descansos)\b[^·]*/g, '')
  .replace(/al pecho|apoyo de pecho|pecho apoyado|apoyad[oa] en (el )?pecho|con apoyo en banco/g, '');   // el remo "al pecho" no es pecho
const esCurlBrazo = t => /\bcurl\b/.test(t) && !/femoral|\bleg\b|hamstring|nordic|nordico|isquio/.test(t);
const NOMBRE_MUSCULO = {gluteo:'glúteo', cuadriceps:'cuádriceps', femoral:'femoral', gemelo:'gemelos',
  pecho:'pecho', hombro:'hombros', espalda:'espalda', brazos:'brazos', core:'core', lumbar:'lumbar', aductor:'aductores'};
const PIERNAS = ['gluteo','cuadriceps','femoral','gemelo'];
/* v5.14: cuantos ejercicios del dia tocan cada musculo. Los que mas se
   repiten son lo que "trabajas" (verde fuerte); el resto, lo que "ayuda"
   (verde suave). CRITERIO NUESTRO: principal = al menos la mitad de veces
   que el musculo mas trabajado del dia. Los aductores acompanan siempre a
   gluteo y cuadriceps. */
function cuentaMusculos(bl, dia){
  const tipo = tipoSesion(bl, dia), c = {};
  if(!tipo || tipo === 'test' || tipo === 'movilidad') return c;
  const meta = diasDeBloque(bl).find(x=>norm(x['DÍA'])===norm(dia)) || {};
  if(tipo === 'hyrox' || /estaciones|stations/.test(norm(meta['SESIÓN']))){ MUSCULOS.forEach(([k])=>c[k]=1); return c; }
  filasTrabajo(bl, dia).forEach(f=>{
    const t = limpiaEj(f['EJERCICIO / ELEMENTO']), tp = norm(f.TIPO), aqui = new Set();
    if(tp === 'movilidad' || (tp === 'running' && esPaseo(f))) return;   // movilidad y paseos no pintan musculos
    if(tp === 'running' || (tp === 'hibrido' && CARRERA_SI.test(t))) PIERNAS.forEach(k=>aqui.add(k));
    MUSCULOS.forEach(([k, re])=>{ if(re.test(t)) aqui.add(k); });
    if(esCurlBrazo(t)) aqui.add('brazos');
    aqui.forEach(k=>{ c[k] = (c[k]||0) + 1; });
  });
  return c;
}
function musculosSesion(bl, dia){ return new Set(Object.keys(cuentaMusculos(bl, dia))); }
function nivelesMusculos(bl, dia){
  const c = cuentaMusculos(bl, dia), max = Math.max(0, ...Object.values(c)), on = new Set(), ay = new Set();
  Object.keys(c).forEach(k=>{ (c[k] >= max/2 ? on : ay).add(k); });
  if((on.has('gluteo') || on.has('cuadriceps')) && !on.has('aductor')) ay.add('aductor');
  return {on, ay};
}

const CURVAS = {};
function curva(pts){
  if(CURVAS[pts]) return CURVAS[pts];
  const p = pts.split(' ').map(q=>q.split(',').map(Number)), n = p.length;
  let d = 'M' + p[0][0] + ' ' + p[0][1];
  for(let i=0;i<n;i++){
    const a=p[(i-1+n)%n], b=p[i], c=p[(i+1)%n], e=p[(i+2)%n];
    d += 'C' + (b[0]+(c[0]-a[0])/6).toFixed(1) + ' ' + (b[1]+(c[1]-a[1])/6).toFixed(1) + ' '
             + (c[0]-(e[0]-b[0])/6).toFixed(1) + ' ' + (c[1]-(e[1]-b[1])/6).toFixed(1) + ' ' + c[0] + ' ' + c[1];
  }
  return CURVAS[pts] = d + 'Z';
}
/* Los chicos se conocen por su enlace (como FOTOS_SIN), asi no hay que tocar
   sus hojas. La ficha manda si lo dice: figura = hombre | mujer. */
const FIGURA_H = ['ben','carlos','jorge','sergio','sergiol','ignacio'];
const figuraDe = () => { const f = ajuste('figura');
  if(/^(hombre|chico|man|male|h)$/.test(f)) return 'h';
  if(/^(mujer|chica|woman|female|m)$/.test(f)) return 'm';
  return FIGURA_H.indexOf(String(CID||'').toLowerCase()) > -1 ? 'h' : 'm'; };
function svgCuerpo(niv){
  const f = figuraDe(), A = FIGURAS[f+'f'], B = FIGURAS[f+'b'];
  const una = F => `<path class="n" d="${curva(F.s)}"/>` + F.z.map(([g, pts])=>
    `<path class="z${niv.on.has(g)?' on':(niv.ay.has(g)?' ay':'')}" d="${curva(pts)}"/>`).join('');
  const gap = 30, W = A.vb[2] + gap + B.vb[2], H = Math.max(A.vb[3], B.vb[3]);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(tr('Músculos que trabajas hoy'))}">
    <g transform="translate(${-A.vb[0]} ${-A.vb[1]})">${una(A)}</g>
    <g transform="translate(${A.vb[2] + gap - B.vb[0]} ${-B.vb[1]})">${una(B)}</g></svg>`;
}
function mapaCuerpo(bl, dia, peq){
  const niv = nivelesMusculos(bl, dia); if(!niv.on.size) return '';
  const orden = MUSCULOS.map(([k])=>k);
  const todos = orden.filter(k=>niv.on.has(k) || niv.ay.has(k));
  const nombres = set => orden.filter(k=>set.has(k)).map(k=>tr(NOMBRE_MUSCULO[k])).join(' · ');
  const entero = todos.length >= orden.length - 1;
  return `<div class="mapa${peq?' peq':''}">${svgCuerpo(niv)}
    <div class="txt"><b>${tr('Hoy trabajas')}</b>${esc(entero ? tr('Cuerpo entero') : nombres(niv.on))}${
      niv.ay.size && !entero ? `<i>${tr('Ayudan')}: ${esc(nombres(niv.ay))}</i>` : ''}</div></div>`;
}

  fuerza: '<path d="M8 50h104" stroke-width="5"/><rect x="16" y="28" width="9" height="44" rx="2"/><rect x="27" y="34" width="7" height="32" rx="2"/><rect x="95" y="28" width="9" height="44" rx="2"/><rect x="86" y="34" width="7" height="32" rx="2"/>',
  carrera: '<path d="M-4 92C40 92 58 30 124 26"/><path d="M-4 78C34 78 52 18 124 12"/><path d="M-4 64C28 64 46 6 124 -2"/><path d="M84 8l10 30" stroke-dasharray="3 4"/>',
  hyrox: '<path d="M48 40a12 12 0 0 1 24 0"/><path d="M44 42h32"/><circle cx="60" cy="66" r="24"/><path d="M8 94h104"/>',
};
DIBUJO.hibrido = DIBUJO.hyrox;
DIBUJO.test = '<path d="M14 70h92" stroke-width="4"/><path d="M24 70v-12M40 70v-20M56 70v-12M72 70v-20M88 70v-12"/>';
DIBUJO.movilidad = '<path d="M60 18a32 32 0 1 1-30 21"/><path d="M24 30l6 9 9-5"/><circle cx="60" cy="50" r="6"/>';
const ETIQ_TIPO = {fuerza:'Fuerza', carrera:'Carrera', hyrox:'HYROX', hibrido:'Híbrido', test:'Tests y medidas', movilidad:'Movilidad'};
/* v5.16: CABECERAS CON FOTO (elegidas por Salvador, 2 oct; estilo "foto en
   tarjeta, blanco y negro"). Chica para ellas y chico para ellos (figuraDe).
   - fuerza: foto de fuerza. Si despues viene carrera, a mitad de sesion la
     tarjeta verde con el corredor: "Ahora toca correr".
   - carrera: foto corriendo; suave o rapida segun la intensidad del dia. Si
     despues viene fuerza: "Ahora toca fuerza".
   - HYROX (o hibrido): su logo en los colores SALVA (Salvador tiene permiso).
   - movilidad y cardio suave: foto de movilidad.
   La cabecera la decide la PRIMERA parte de la sesion (fuerza o carrera). */
const generoFoto = () => figuraDe() === 'h' ? 'hombre' : 'mujer';
const CORRER = /\b(run|running|carrera|rodaje|trote|maraton|marathon|tirada|correr|jog|fartlek|cambios de ritmo|series|cuestas|hill|tempo|umbral|threshold|sprint|strides|progresivos|pace|interval)|\bkm\b|\/km|^\S*\s*\d+\s*[x×]\s*\d+\s*(min|m|km|s)\b/;
const MAQUINA = /\bski|skierg|bici|bike|cycl|remo|\brow|elipti|ellipti|assault|stair|escaladora/;
function claseFila(f){
  const t = norm(f && f.TIPO), n = norm(f && f['EJERCICIO / ELEMENTO']);
  if(t === 'fuerza' || t === 'extra') return 'f';
  // maquinas y bici no son correr (el SkiErg de Ben, la bici de Ana)
  if(t !== 'running') return '';
  if(esPaseo(f) || CARRERA_NO.test(n) || (MAQUINA.test(n) && !CARRERA_SI.test(n))) return '';
  /* solo cuenta como correr si el nombre o la dosis lo dicen: el "Motor" de
     Jorge, el HIIT de Ben o el titulo "Strength A" de Smi no son carrera */
  const txt = n + ' ' + norm(f['REPS / DOSIS']) + ' ' + norm(f['MAIN SET']);
  return CORRER.test(txt) ? 'c' : '';
  return '';
}
/* CRITERIO NUESTRO: intensa si el semaforo es rojo o hay series, cuestas,
   intervalos, fartlek, umbral, tempo, sprints o un "6 x 400 m". */
function carreraIntensa(bl, dia){
  const meta = diasDeBloque(bl).find(x=>norm(x['DÍA'])===norm(dia)) || {};
  if(semColor(meta['SEMÁFORO']) === 'rojo') return true;
  return filasTrabajo(bl, dia).filter(f=>claseFila(f)==='c').some(f=>{
    const t = norm([f['EJERCICIO / ELEMENTO'], f['REPS / DOSIS'], f['MAIN SET'], meta['SESIÓN']].join(' '));
    if(/run.?walk|trote.?(andar|camina)|andar|caminar/.test(t)) return false;     // el run-walk es suave
    return /series|cuesta|interval|fartlek|umbral|tempo|sprint|ritmo de carrera|\b\d+\s*[x×]\s*\d/.test(t);
  });
}
function cabTipo(bl, dia){
  const t = tipoSesion(bl, dia);
  if(t === 'hyrox' || t === 'hibrido') return 'hyrox';
  if(t === 'test') return 'test';
  if(t === 'movilidad') return 'movilidad';
  if(!t){
    // cardio suave: solo paseos o bici, o filas de movilidad
    const fs = filasSesion(bl, dia);
    return fs.some(f=>esPaseo(f) || norm(f.TIPO)==='movilidad' || esMovilidad(f)) ? 'movilidad' : null;
  }
  const primera = filasTrabajo(bl, dia).map(claseFila).find(Boolean);
  if(primera === 'c') return 'carrera';
  if(!primera) return null;          // solo maquinas o bici: sin foto
  return 'fuerza';
}
function cabeceraSesion(bl, dia){
  const t = cabTipo(bl, dia); if(!t) return '';
  if(t === 'test') return `<div class="cab"><svg viewBox="0 0 120 100" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true">${DIBUJO.test}</svg>
    <span class="k">${tr(ETIQ_TIPO.test)}</span></div>`;
  if(t === 'hyrox') return `<div class="cabf hx"><img src="img/hyrox.jpg" alt="HYROX"><i class="m"></i><i class="s"></i></div>`;
  const g = generoFoto();
  const src = t === 'fuerza' ? `img/fuerza-${g}.jpg`
            : t === 'movilidad' ? `img/movilidad-${g}.jpg`
            : `img/correr-${g}-${carreraIntensa(bl, dia) ? 'rapido' : 'suave'}.jpg`;
  const et = {fuerza:'Fuerza', carrera:'Carrera', movilidad:'Movilidad'}[t];
  return `<div class="cabf"><img src="${src}" alt=""><span class="pl">${tr(et)}</span></div>`;
}
/* El cambio a mitad de sesion: de fuerza a carrera, o de carrera a fuerza */
function cambioDeParte(clase){
  if(clase === 'c') return `<div class="cambio"><div class="cf co"><img src="img/corredor.jpg" alt=""><i></i></div>
    <div><b>${tr('Carrera')}</b><span>${tr('Ahora toca correr')}</span></div></div>`;
  return `<div class="cambio"><div class="cf"><img src="img/fuerza-${generoFoto()}.jpg" alt=""></div>
    <div><b>${tr('Fuerza')}</b><span>${tr('Ahora toca fuerza')}</span></div></div>`;
}
function ejerciciosConCambios(bl, dia, ejs){
  const t = cabTipo(bl, dia);
  let primera = null, puesto = false;
  return ejs.map(f=>{
    const c = claseFila(f);
    let antes = '';
    if(c && !primera) primera = c;
    else if(c && !puesto && c !== primera && (t === 'fuerza' || t === 'carrera')){ antes = cambioDeParte(c); puesto = true; }
    return antes + ejercicio(bl, dia, f);
  }).join('');
}

/* ---------- barra de progreso de la sesion (en la cabecera) ----------
   Cuenta ejercicios con algo anotado, aunque no lleven "Anotar": es lo que se
   enviara. Lo que se marca como no hecho cuenta como resuelto. */
function progresoSesion(bl, dia){
  let total = 0, hechos = 0;
  sesionDe(bl, dia).filter(f=>parseInt(f.ORDEN)>0 && !esExtra(f)).forEach(f=>{
    const nombre = nombreEf(bl, dia, f), n = parseInt(f.SERIES)||0, cs = camposDe(f);
    if(!cs.length && !n) return;
    total++;
    if(saltado(bl, dia, nombre)){ hechos++; return; }
    const vale = v => v && !v.borrada && (v.ok || tieneAlgo(v));
    if(cs.length){ if(vale(LOG[idReg(bl,dia,nombre)])) { hechos++; return; } }
    for(let i=0;i<n;i++){ if(vale(LOG[idSerie(bl,dia,nombre,i)])){ hechos++; return; } }
  });
  return {total, hechos};
}
function barraSesion(){
  if(S.vista !== 'sesion' || soloLectura() || !S.d) return '';
  const bl = bloqueDe(semanaVista()), dia = S.dia || (diaDeHoy(bl)||{})['DÍA'];
  if(!dia) return '';
  const p = progresoSesion(bl, dia); if(!p.total) return '';
  return `<div class="pg" aria-live="polite"><div class="t"><span>${tr('Tu sesión')}</span>
      <span id="pg_t">${textoBarra(p)}</span></div>
    <div class="b"><i id="pg_i" style="width:${Math.round(p.hechos/p.total*100)}%"></i></div></div>`;
}
const textoBarra = p => `${p.hechos} ${enIngles()?'of':'de'} ${p.total} ${tr(p.total === 1 ? 'ejercicio' : 'ejercicios')}`;
function actualizaBarra(){
  const t = document.getElementById('pg_t'), i = document.getElementById('pg_i');
  if(!t || !i || S.vista !== 'sesion') return;
  const bl = bloqueDe(semanaVista()), dia = S.dia || (diaDeHoy(bl)||{})['DÍA'];
  const p = progresoSesion(bl, dia); if(!p.total) return;
  t.textContent = textoBarra(p);
  i.style.width = Math.round(p.hechos/p.total*100) + '%';
}

/* ================= SESIÓN Y REGISTRO =================
   Regla de oro de esta pantalla: lo que se escribe NO se pierde nunca.
   Se guarda al teclear y la pantalla no se redibuja al confirmar una
   serie, para no arrastrar lo escrito en las demás.

function abrir(dia){
  S.dia=dia; S.vista='sesion'; S.video=null;
  const bl=bloqueDe(semanaVista());
  // En modo lectura no se marca nada: mirar una semana futura no es hacerla.
  if(!S.mirando && modoLibre(bl)) marcaFecha(bl,dia);
  window.scrollTo(0,0); pinta();
}

          `<button id="est_${vid}_${i}" class="${i<=n?'on':''}" onclick="valora('${esc(bl)}','${esc(dia)}',${i})"

/* v4.6: las hojas traen las indicaciones en trozos con nombre, separados por
   una linea en blanco: "How to run it\n<frase>". Se pinta el nombre en negrita
   y la frase debajo. Un parrafo de tres instrucciones seguidas no lo lee nadie. */
function pintaCue(t){
  return String(t||'').split(/\n{2,}/).map(function(b){
    const ls = b.split('\n').filter(x=>x.trim());
    if(ls.length > 1 && ls[0].length <= 30)
      return `<p><b>${esc(ls[0])}</b><br>${esc(ls.slice(1).join(' '))}</p>`;
    return `<p>${ls.map(esc).join('<br>')}</p>`;   // sin titulo, pero cada linea en la suya
  }).join('');
}

/* ---------- v5.20 · ejercicios con alternativa (3 oct, Salvador) ----------
   "Sentadilla trasera con barra (o prensa)": Alexia hizo prensa y sus 100 kg
   acabaron en la sentadilla. Ahora la tarjeta trae dos botones y lo que se
   anota se guarda con el ejercicio que de verdad se hizo, y asi sale en
   Progreso. La primera opcion conserva el nombre de siempre (el historial no
   se parte); la otra lleva el suyo. Solo en fuerza: en "bici o caminata" no
   hay kilos que separar. */
const MATERIAL = /^(con |en )?(la |el )?(barra|multipower|m[aá]quina|mancuernas?|polea|disco|kettlebell|machine|dumbbells?|cable|barbell)$/i;
const may = t => t.charAt(0).toUpperCase() + t.slice(1);
function alternativasDe(f){
  const n = String((f && f['EJERCICIO / ELEMENTO']) || '').trim();
  if(!f || ['fuerza','hibrido'].indexOf(norm(f.TIPO)) < 0 || !(parseInt(f.SERIES) > 0)) return null;
  if(/^(calentamiento|warm-?up|si tienes)/i.test(n) || /\((potencia|power)\)/i.test(n)) return null;
  let a, b, m, suf = '';
  if((m = n.match(/^(.+?)\s*\((?:o|or)\s+([^)]+)\)\s*$/i))){ a = m[1].trim(); b = m[2].trim(); }
  else {
    const sp = n.match(/^(.*?)(\s*\([^)]*\))?\s*$/); const cuerpo = sp[1]; suf = sp[2] || '';
    if((m = cuerpo.match(/^(.+?)\s+\/\s+(.+)$/))){ a = m[1].trim(); b = m[2].trim(); }
    else if((m = cuerpo.match(/^(.+?)\s+(?:o|or)\s+(.+)$/i)) && m[1].trim().split(/\s+/).length > 1){
      a = m[1].trim(); b = m[2].trim();
      if(b.split(/\s+/).length === 1 && !MATERIAL.test(b)) b = a.split(/\s+/).slice(0,-1).join(' ') + ' ' + b;
    } else return null;
  }
  if(!a || !b) return null;
  if(MATERIAL.test(b)){
    const cab = a.split(/\s+(?:en|con|on|with)\s+/i)[0];
    b = cab + ' ' + (/^(con|en) /i.test(b) ? b : (/^m[aá]quina/i.test(b) ? 'en ' + b : 'con ' + b));
  }
  return [n, may(b) + suf.replace(/^\s*/, suf ? ' ' : '')].map((x,i)=>({id: i ? x : n, txt: i ? x : may(a) + (suf ? suf : '')}));
}
const idAlt = (bl,dia,n) => `${SEM()}~${slug(bl)}~${slug(dia)}~${slug(n)}~alt`;
function altElegida(bl, dia, f){
  const alts = alternativasDe(f); if(!alts) return 0;
  const v = LOG[idAlt(bl,dia,alts[0].id)];
  if(v && typeof v.alt === 'number') return v.alt;
  // sin eleccion guardada: si ya hay series de la alternativa, es la alternativa
  return [0,1,2,3,4,5].some(i=>{ const x = LOG[idSerie(bl,dia,alts[1].id,i)]; return x && (x.ok || x.r || x.c); }) ? 1 : 0;
}
/* el nombre con el que se anota hoy */
const nombreEf = (bl, dia, f) => { const a = alternativasDe(f); return a ? a[altElegida(bl,dia,f)].id : (f['EJERCICIO / ELEMENTO'] || ''); };
function eligeAlt(bl, dia, n, i){ LOG[idAlt(bl,dia,n)] = {alt:i}; LS.set('log', LOG); pinta(); }

function ejercicio(bl,dia,f){
  const alts = soloLectura() ? null : alternativasDe(f), elegida = alts ? altElegida(bl,dia,f) : 0;
  const botonesAlt = alts ? `<div class="alt" role="group" aria-label="${tr('Qué ejercicio haces')}">
      <span class="sm">${tr('Hoy haces')}</span>${alts.map((x,i)=>`<button class="${i===elegida?'on':''}" aria-pressed="${i===elegida}"
        onclick="eligeAlt('${esc(bl)}','${esc(dia)}','${esc(alts[0].id)}',${i})">${esc(x.txt)}</button>`).join('')}</div>` : '';
  if(alts) f = Object.assign({}, f, {'EJERCICIO / ELEMENTO': alts[elegida].id});
  const nombre = f['EJERCICIO / ELEMENTO'] || '';
  const series = parseInt(f.SERIES)||0;
  const ficha = fichaEj(nombre);
  const vid = ficha ? idYoutube(ficha['VÍDEO']) : null;
  const cues = f.CUES || (ficha ? ficha.CUES : '') || '';
  /* v4.6: la hoja de un corredor trae ritmos donde la de fuerza trae RIR.
     Un "5:55-6:20/km" no es un RIR y no se le pone esa etiqueta delante; un
     "RPE 3-4" tampoco es un ritmo. Y si el MAIN SET dice lo mismo que la dosis,
     no se escribe dos veces: eso es lo que hacia la pantalla ilegible. */
  const esRitmo = v => /\d\s*:\s*\d|\/\s*km|\bmin\/km\b/i.test(String(v||''));
  const esEsfuerzo = v => /^\s*(rpe|rir|ritmo|pace|effort)\b/i.test(String(v||''));
  /* La etiqueta solo se pone cuando el valor es un dato pelado ("5:55-6:20/km").
     Si ya es una frase, se deja tal cual: "Ritmo Approximately 5:15/km if the
     effort allows" no lo lee nadie. */
  const etiqueta = (v, et) => { const t = String(v||'').trim();
    if(!t || t==='—') return '';
    if(!et || esEsfuerzo(t) || t.length > 24) return t;
    // Si el valor ya empieza por la propia etiqueta, no se repite:
    // "Descanso descanso igual" no lo escribe nadie a proposito.
    if(norm(t).startsWith(norm(et))) return t;
    // "RIR" solo delante de un numero. Un "fuerte" o un "pesado" no es un RIR,
    // y un "95 % de tu VAM" tampoco (v5.0).
    if(norm(et)==='rir' && (!/^\d/.test(t) || /%/.test(t))) return t;
    return et+' '+t; };
  const dosis = f['REPS / DOSIS']||'', main = f['MAIN SET']||'';
  const mismo = norm(main) === norm(dosis);
  const extra = [f.KM?'KM '+f.KM:'', mismo?'':main,
    etiqueta(f['PACE / RPE'], esRitmo(f['PACE / RPE'])?tr('Ritmo'):''),
    f.FUEL?'Fuel: '+f.FUEL:''].filter(Boolean).join(' · ');
  /* v5.12: numeros grandes. En fuerza, "3 × 8-10" va en grande y el resto
     (RIR, tempo, descanso) en pequeno debajo. */
  const cabDosis = series ? series+' × '+dosis : dosis;
  const grande = series > 0 && !camposDe(f).length && cabDosis.length <= 24 ? cabDosis : '';
  const ds = [grande ? '' : cabDosis,
    etiqueta(f['RIR / RPE'], esRitmo(f['RIR / RPE'])?tr('Ritmo'):'RIR'),
    etiqueta(f.TEMPO, 'Tempo'), etiqueta(f.DESCANSO, tr('Descanso'))].filter(Boolean).join(' · ');
  const dg = grande ? `<div class="dg">${esc(grande)}</div>` : '';
  const eid = slug(nombre);
  recordarNombre(idNota(bl,dia,nombre), nombre);

  /* v5.4: mirando otra semana se ve la tarjeta entera (nombre, dosis,
     indicaciones y el buscador de vídeo) y NADA que escriba: ni casillas, ni
     series, ni nota, ni "no lo he hecho". */
  if(soloLectura()){
    const vid2 = ficha ? idYoutube(ficha['VÍDEO']) : null;
    return `<div class="ej">
      <div class="h"><div><div class="nm">${esc(nombre)}</div>${dg}${ds?`<div class="ds">${esc(conVAM(ds))}</div>`:''}
        ${extra?`<div class="ds">${esc(extra)}</div>`:''}</div></div>
      ${cues?`<div class="cue">${pintaCue(conVAM(cues))}</div>`:''}
      ${!vid2 && (series || camposDe(f).length) && ['running','evento','descanso','info'].indexOf(norm(f.TIPO))<0
        ? `<a class="verej" href="${esc(buscarYoutube(nombre))}" target="_blank" rel="noopener">🔎 ${tr("Ver cómo se hace")}</a>`
        : ''}</div>`;
  }

  const campos = camposDe(f);
  const uni = unidadDe(eid);
  let registro = '';
  if(campos.length && !saltado(bl,dia,nombre)){
    const rid = idReg(bl,dia,nombre);
    recordarNombre(rid, nombre);
    const v = LOG[rid] || {}, d = v.d || {}, cs = campos.join('-');
    registro = `<div class="reg ${v.ok?'ok':''}" id="reg_${rid}">
      ${esCorrer(f) && series>1 ? `<div class="totales">${tr('Totales de la sesión')}</div>` : ''}
      ${campos.map(k=>casilla(rid, k, d, cs, nombre)).join('')}
      ${campos.indexOf('km')>-1 && campos.indexOf('tiempo')>-1
        ? `<div class="ritmo${d.km && aSegundos(d.tiempo) && !ritmoCreible(d) ? ' mal' : ''}" id="ritmo_${rid}">${esc(textoRitmo(d))}</div>` : ''}
      ${campos.indexOf('vam')>-1 ? `<div class="ritmo" id="vam_${rid}">${esc(textoVAM(d.vam, rid))}</div>` : ''}
      <button id="rb_${rid}" onclick="confirmarReg('${rid}','${cs}')">${tr(cs==='hecho' ? (v.ok?'Hecho ✓':'Marcar como hecho') : (v.ok?'Hecha':'Anotar'))}</button>
    </div>`;
  }

  let sets = '';
  if(saltado(bl,dia,nombre)){ sets = ''; registro = ''; }
  else if(campos.length ? (esCorrer(f) && series>1) : ((corrPorTiempo(f) || aguantePorTiempo(f)) && series>0)){
    /* v5.2: una carrera no se anota con kilos. Si son series o cuestas,
       cada una tiene su fila (tiempo y esfuerzo) y los totales van debajo;
       plegado, porque la mayoria de dias solo hace falta el total. */
    sets = setsCorre(bl, dia, nombre, series, campos.length>0);
  }
  else if(series>0 && !campos.length){
    sets = `${hayLibras() ? `<div class="uni">${tr('Pesos en')}
        ${['kg','lb'].map(x=>`<button class="${x===uni?'on':''}" aria-pressed="${x===uni}"
          onclick="cambiaUnidad('${esc(bl)}','${esc(dia)}','${esc(nombre)}','${x}')">${x}</button>`).join('')}</div>` : ''}
      <div class="sets">${Array.from({length:series},(_,i)=>{
      const id = idSerie(bl,dia,nombre,i);
      recordarNombre(id, nombre);
      const v = LOG[id] || {};
      return `<div class="set ${v.ok?'ok':''} ${v.sent?'sent':''}" id="fila_${id}">
        <span class="i">${i+1}${v.c && hayLibras() && (v.u||'kg') !== uni ? `<small>${v.u||'kg'}</small>` : ''}</span>
        <input inputmode="numeric" placeholder="reps" value="${esc(v.r||'')}" id="r_${id}"
          oninput="anota('${id}')" aria-label="Repeticiones serie ${i+1} de ${esc(nombre)}">
        <input inputmode="decimal" placeholder="${uni}" value="${esc(v.c||'')}" id="c_${id}"
          oninput="anota('${id}')" aria-label="Carga serie ${i+1} (${uni})">
        <span class="rirc"><input inputmode="numeric" placeholder="RIR" value="${esc(v.rir||'')}" id="i_${id}"
          oninput="anota('${id}')" aria-label="RIR serie ${i+1}"><button type="button" class="rq"
          onclick="ayudaRIR('${id}')" data-obj="${esc(rirObjetivo(f))}" id="rq_${id}"
          aria-label="${tr('¿Qué pongo en el RIR?')}">${enIngles()?'?':'¿?'}</button></span>
        <button id="b_${id}" onclick="confirmar('${id}')">${tr(v.ok?'Hecha':'Anotar')}</button>
        <button class="x" onclick="vaciar('${id}')" aria-label="${tr('Vaciar')} ${tr('serie')} ${i+1}" title="${tr('Vaciar')}">✕</button>
      </div>${rirRaro(v.rir) && !v.sent ? avisoRIR(id) : ''}`;}).join('')}</div>`;
  }

  return `<div class="ej">
    <div class="h"><div><div class="nm">${esc(alts ? alts[elegida].txt : nombre)}</div>${botonesAlt}${dg}${ds?`<div class="ds">${esc(conLb(conVAM(ds),uni))}</div>`:''}
      ${extra?`<div class="ds">${esc(conLb(extra,uni))}</div>`:''}</div></div>
    ${(function(){ const sg = (!campos.length && series>0 && !aguantePorTiempo(f)) ? sugerencia(bl,dia,f) : '';
        return sg || lineaUltima(campos.length ? ultimaVezReg(bl,dia,nombre) : (series>0 ? ultimaVez(bl,dia,nombre) : null), uni); })()}
    ${cues?`<div class="cue">${pintaCue(conLb(conVAM(cues),uni))}</div>`:''}
    ${(series || campos.length || pideVideo(f)) ? (function(){
      const idn = idNota(bl,dia,nombre); const txt = textoNota(idn);
      const ab = S.nota===idn || !!txt;
      return `<div class="notaej">
        ${ab?'':`<button class="abrir" onclick="abrirNota('${idn}')">💬 ${tr("¿Algo que contarme de este ejercicio?")}</button>`}
        ${bloqueVideo(bl,dia,nombre,f)}${bloqueFoto(bl,dia,nombre,f)}
        ${ab?`<button class="abrir con" onclick="cerrarNota()">💬 ${tr("Tu nota para Salva")}</button>
          <textarea id="n_${idn}" oninput="guardaNota('${idn}',this.value)"
            placeholder="${tr("Dudas, sensaciones, si te ha gustado o no, molestias, la máquina estaba ocupada…")}">${esc(txt)}</textarea>
          <p class="pista">${tr("Se envía junto con la sesión. Salva lo ve con el nombre del ejercicio.")}</p>`:''}
      </div>`;
    })() : ''}
    ${vid ? (S.video===eid
      ? `<div class="vid"><iframe src="https://www.youtube.com/embed/${esc(vid)}?rel=0&modestbranding=1"
           title="${esc(nombre)}" allow="accelerometer; encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>
         <button class="verej" onclick="verVideo(null)">${tr("Ocultar vídeo")}</button>`
      : `<button class="verej" onclick="verVideo('${eid}')">▶ ${tr("Ver ejercicio")}</button>`)
      : ((series>0 || campos.length) && ['running','evento','descanso','info'].indexOf(norm(f.TIPO))<0
        ? `<a class="verej" href="${esc(buscarYoutube(nombre))}" target="_blank" rel="noopener">🔎 ${tr("Ver cómo se hace")}</a>`
        : '')}
    ${/* v4.8: antes esto se decidia por el TIPO, y solo valia "fuerza" e
         "hibrido". Pero un face pull marcado como "extra" sigue siendo un
         ejercicio, y a Sergio se le quedaban nueve sin el buscador. Lo que
         decide no es la etiqueta: es si hay SERIES que hacer. */''}
    ${sets}${registro}${saltado(bl,dia,nombre) ? '' : filasEstaciones(bl, dia, nombre, f)}
    ${(function(){
      if(!(series>0 || campos.length)) return '';
      const sal = saltado(bl,dia,nombre);
      return sal
        ? `<div class="saltado">⊘ ${tr("No lo has hecho.")}
             <button onclick="quitaSalto('${esc(bl)}','${esc(dia)}','${esc(nombre)}')">${tr("Deshacer")}</button></div>`
        : `<div class="nohecho"><button onclick="salta('${esc(bl)}','${esc(dia)}','${esc(nombre)}')">⊘ ${tr("No he hecho este ejercicio")}</button></div>`;
    })()}</div>`;
}
/* v5.3 ponia "toca aqui" al final de estas lineas porque no se veia que eran
   botones. v5.11 (hoja de ruta, 2 oct): fuera la coletilla; ahora tienen
   fondo, borde e icono, como cualquier boton. */

function verVideo(id){ S.video = id; pinta(); }

/* Marcar un ejercicio como no hecho. Va a la hoja como "omitida" con el
   nombre del ejercicio, asi Salvador ve exactamente cual se salto. */
function salta(bl, dia, ej){
  LOG[idSalto(bl,dia,ej)] = {salto:true, ok:true, ts:new Date().toISOString()};
  LS.set('log', LOG); toast(tr("Anotado: este no lo has hecho.")); pinta();
}
function quitaSalto(bl, dia, ej){
  const id = idSalto(bl,dia,ej), v = LOG[id] || {};
  if(v.sent) LOG[id] = Object.assign({}, v, {ok:false, borrada:true, corregido:true});
  else delete LOG[id];
  LS.set('log', LOG); pinta();
}

/* v3.18: mientras Salvador no tenga grabado su vídeo del ejercicio, el
   boton lleva a una busqueda en YouTube con el nombre del ejercicio ya
   escrito. Asi nadie tiene que copiar el nombre y buscarlo a mano.
   En cuanto haya vídeo propio en la pestaña EJERCICIOS, manda el suyo. */
function buscarYoutube(nombre){
  const limpio = String(nombre||'').replace(/\([^)]*\)/g,' ')   // quita "(o prensa)"
                                   .replace(/[\/→>|]+/g,' ')
                                   .replace(/\s+/g,' ').trim();
  return 'https://www.youtube.com/results?search_query=' +
         encodeURIComponent(limpio + ' ' + tr('técnica'));
}

/* ---------- vídeos de técnica ----------
   El botón solo sale si el puente del cliente ya sabe recibirlos (S.d.VIDEO).
   Se manda uno por ejercicio y sesión: el nuevo sustituye al anterior. */
/* v3.20: la foto del reloj solo tiene sentido en una carrera de verdad:
   una tirada, un rodaje, unos intervalos. No en el core, la movilidad o el
   enfriamiento que van dentro de una sesion de running, y no en los
   hibridos tipo HYROX: de los 400 m entre estacion y estacion el reloj no
   dice nada que sirva. En hibrido solo pasa la fila que es en si una
   carrera (un "run-walk largo"), no las rondas ni el formato. */
const CARRERA_NO = /core|diafragma|plancha|movilidad|respiraci|estiramiento|tecnica|fuerza|meta|foco|enfriamiento|calentamiento/;
const CARRERA_SI = /\b(run|carrera|rodaje|trote|maraton|tirada|correr)/;
const esCarrera = f => {
  if(!f) return false;
  const n = norm(f['EJERCICIO / ELEMENTO']);
  if(CARRERA_NO.test(n)) return false;
  if(!String(f['REPS / DOSIS'] || f.KM || f['MAIN SET'] || '').trim()) return false;   // fila informativa
  const t = norm(f.TIPO);
  if(t === 'running') return true;
  if(t === 'hibrido') return CARRERA_SI.test(n);
  return false;
};

/* Una foto del reloj al terminar: es la forma mas rapida de que quede el
   dato real (ritmo, distancia, tiempo) sin copiarlo a mano. */
function bloqueFoto(bl, dia, nombre, f){
  if(!S.d || !S.d.VIDEO) return '';
  if(!esCarrera(f)) return '';
  const id = idFoto(bl, dia, nombre);
  const v = VID[id] || {};
  const serv = (S.d.MIS_VIDEOS||[]).find(x=>String(x.ID)===id) || {};
  const hecha = v.estado === 'enviado' || !!serv.ID;
  return `<input type="file" accept="image/*" id="vf_${id}" style="display:none"
      onchange="subirVideo('${id}','${esc(bl)}','${esc(dia)}',this)">
    ${v.estado === 'enviando'
      ? `<p class="pista">⏳ ${tr("Enviando la foto…")}</p>`
      : `<button class="abrir" onclick="document.getElementById('vf_${id}').click()">📸 ${
          hecha ? tr("Mandar otra foto") : tr("Hazle una foto a tu reloj al terminar y mándamela")}</button>`}
    ${hecha && v.estado !== 'enviando' ? `<p class="pista">✅ ${tr("Foto enviada")}${v.fecha?' · '+esc(v.fecha):''}</p>` : ''}
    ${serv.RESPUESTA ? `<div class="calent" style="margin:6px 0"><b>${tr("Lo que te dice Salva")}.</b> ${esc(serv.RESPUESTA)}</div>` : ''}`;
}

function bloqueVideo(bl, dia, nombre, f){
  if(!S.d || !S.d.VIDEO) return '';
  /* v4.7: en una sesion de carrera no se pide video. Nadie se graba a si mismo
     en mitad de una tirada de 22 km, y ahi lo util es la foto del reloj, que va
     aparte. El video es para la tecnica de los ejercicios. */
  if(norm(f.TIPO) === 'running') return '';
  const id = idVideo(bl, dia, nombre);
  const v = VID[id] || {};
  const serv = (S.d.MIS_VIDEOS||[]).find(x=>String(x.ID)===id) || {};
  const enviado = v.estado === 'enviado' || !!serv.ID;
  const aviso = tr("Máximo 20 segundos: los vídeos largos no llegan a enviarse. Puedes grabarlo ahora o subir uno que ya tengas. No hace falta la serie entera, solo un par de repeticiones lo mejor que puedas. Si puedes, recorta el vídeo hasta justo antes de empezar: así entran más repeticiones y lo veo mejor.");
  return `<div class="video">
    <input type="file" accept="video/*" id="vf_${id}" style="display:none"
      onchange="subirVideo('${id}','${esc(bl)}','${esc(dia)}',this)">
    ${v.estado === 'enviando'
      ? `<p class="pista">⏳ ${tr("Enviando el vídeo…")}</p>`
      : `<button class="abrir" onclick="avisoVideo('${id}')">📹 ${!enviado && pideVideo(f)
          ? `<span class="clic">${tr("Clic aquí")}</span> ${tr("para grabar o subir el vídeo")}`   /* palabras de Salvador (c186e3f): no se tocan */
          : (enviado ? tr("Grabar otro") : tr("¿No sabes si lo estás haciendo bien? Grábate haciéndolo"))}</button>
         ${S.videoAviso === id ? `<div class="calent" style="margin:6px 0">${esc(aviso)}</div>
           <div class="stack" style="margin:0 0 10px;gap:8px">
             <button class="btn sm2 pri" onclick="document.getElementById('vf_${id}').click()">${tr("Grabar o elegir vídeo")}</button>
             <button class="btn sm2" onclick="avisoVideo('${id}')">${tr("Ahora no")}</button></div>` : ''}`}
    ${enviado && v.estado !== 'enviando' ? `<p class="pista">✅ ${tr("Vídeo enviado")}${v.fecha?' · '+esc(v.fecha):''}</p>` : ''}
    ${serv.RESPUESTA ? `<div class="calent" style="margin:6px 0"><b>${tr("Lo que te dice Salva")}.</b> ${esc(serv.RESPUESTA)}</div>` : ''}
  </div>`;
}

function avisoVideo(id){ S.videoAviso = (S.videoAviso === id) ? null : id; pinta(); }

async function subirVideo(id, bl, dia, input){
  S.videoAviso = null;
  const f = input.files && input.files[0];
  input.value = '';
  if(!f) return;
  const esFoto = id.endsWith('~foto');
  if(f.size > (esFoto ? 12 : 45) * 1024 * 1024){
    toast(esFoto ? tr("Esa foto pesa demasiado.") : tr("Ese vídeo pesa demasiado. Graba uno más corto.")); return; }
  if(!esFoto){
    const dur = await duracion(f);
    if(dur && dur > 30){ toast(tr("Ese vídeo es muy largo. Recórtalo a 20 segundos o menos.")); return; }
  }
  const nombre = nombreDe(id.replace(/~(vid|foto)$/,'')) || (id.split('~')[3]||'').replace(/-/g,' ');
  VID[id] = {estado:'enviando'}; LS.set('videos', VID); pinta();
  try{
    const datos = await new Promise((ok, fail)=>{
      const r = new FileReader();
      r.onload = ()=>ok(String(r.result).split(',')[1]);
      r.onerror = fail;
      r.readAsDataURL(f);
    });
    const meta = diasDeBloque(bl).find(x=>norm(x['DÍA'])===norm(dia)) || {};
    const r = await fetch(API, {method:'POST', redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({cliente:CID, token:KEY, video:{
        id: id, fecha: hoyISO(), semana: (S.semana&&S.semana.SEMANA)||'', dia: dia,
        sesion: meta['SESIÓN']||'', ejercicio: nombre, nota: textoNota(idNota(bl,dia,nombre))||'',
        mime: f.type || (esFoto?'image/jpeg':'video/mp4'),
        nombre: f.name || (esFoto?'foto.jpg':'video.mp4'), datos: datos}})});
    const d = await r.json();
    if(d.error) throw new Error(d.error);
    VID[id] = {estado:'enviado', fecha: hoyISO()};
  }catch(e){
    VID[id] = {estado:'error'};
    toast(esFoto ? tr("No se ha podido enviar la foto. Inténtalo otra vez con cobertura.")
                 : tr("No se ha podido enviar el vídeo. Inténtalo otra vez con cobertura."));
  }
  LS.set('videos', VID); pinta();
}

function duracion(f){
  // Si el movil tarda o el archivo es raro, no se espera para siempre: a los 4 s se sigue.
  return new Promise(ok=>{
    let hecho = false;
    const fin = d => { if(!hecho){ hecho = true; ok(d); } };
    setTimeout(()=>fin(0), 4000);
    try{
      const v = document.createElement('video');
      v.preload = 'metadata';
      v.onloadedmetadata = ()=>{ const d = v.duration||0; URL.revokeObjectURL(v.src); fin(d); };
      v.onerror = ()=>fin(0);
      v.src = URL.createObjectURL(f);
    }catch(e){ fin(0); }
  });
}

/* ---------- RIR con ayuda (v5.11, hoja de ruta 2 oct) ----------
   La casilla del RIR sigue igual. El "¿?" abre la pregunta en palabras
   ("¿Cuántas más podías hacer?") con 0 a 4; al elegir, el numero aparece en
   la casilla, para que aprenda que ESO es el RIR. Maximo 4.
   Si escribe mas de 4 (Ben puso 12-20: eran sus repeticiones) no se bloquea
   nada: sale un aviso debajo de la serie. */
const rirRaro = x => { const n = parseFloat(String(x||'').replace(',','.')); return !isNaN(n) && n > 4; };
/* El objetivo del dia, si la hoja lo pone como numero ("1-2", "2"). Un ritmo
   o una palabra no es un RIR y no se ensena. */
function rirObjetivo(f){
  const t = String((f && f['RIR / RPE']) || '').trim();
  if(!/^\d/.test(t) || /%|:|\/\s*km/i.test(t)) return '';
  return t.replace(/^rir\s*/i,'');
}
function avisoRIR(id){
  return `<div class="rirmal" id="rm_${id}">${tr('El RIR va de 0 a 4: las repeticiones que te quedaban, no las que hiciste. Toca ¿? si dudas.')}</div>`;
}
function ayudaRIR(id){
  const abierta = document.getElementById('ra_'+id);
  document.querySelectorAll('.rirayuda').forEach(x=>x.remove());
  if(abierta) return;
  const fila = document.getElementById('fila_'+id); if(!fila) return;
  const q = document.getElementById('rq_'+id), obj = q ? q.getAttribute('data-obj') : '';
  const ya = (document.getElementById('i_'+id)||{}).value || '';
  const div = document.createElement('div');
  div.className = 'rirayuda'; div.id = 'ra_'+id;
  div.innerHTML = `<b>${tr('¿Cuántas más podías hacer?')}</b>
    <div class="escala">${[0,1,2,3,4].map(n=>`<button type="button" class="${ya===String(n)?'on':''}"
      onclick="poneRIR('${id}',${n})">${n}</button>`).join('')}</div>
    <p>${tr('0 = no podías ni una más · 2 = te quedaban dos · 4 = cuatro o más. Eso es el RIR.')}${
      obj ? ' ' + tr('Hoy buscamos') + ' ' + esc(obj) + '.' : ''}</p>`;
  fila.after(div);
}
function poneRIR(id, n){
  const el = document.getElementById('i_'+id);
  if(el) el.value = String(n);
  const ra = document.getElementById('ra_'+id); if(ra) ra.remove();
  anota(id);
}

/* --- guardado automático: NO redibuja la pantalla --- */
function anota(id){
  const r=document.getElementById('r_'+id), c=document.getElementById('c_'+id), i=document.getElementById('i_'+id);
  const prev = LOG[id] || {};
  // si la carga no se ha tocado, conserva su unidad (corregir las reps de
  // una serie en kilos con el boton en lb no la convierte en libras)
  const cv = c.value.trim();
  LOG[id] = Object.assign({}, prev, {r:r.value.trim(), c:cv, rir:i.value.trim(),
    u: prev.c && prev.c === cv ? (prev.u||'kg') : unidadDe(id.split('~')[3])});
  if(prev.sent) LOG[id].corregido = true;      // ya estaba en la hoja: al enviar se actualizará
  LS.set('log', LOG);
  const fila = document.getElementById('fila_'+id);
  if(fila && LOG[id].corregido) fila.classList.add('corr');
  // v5.11: aviso si el RIR pasa de 4 (se quita en cuanto lo corrige)
  const rm = document.getElementById('rm_'+id);
  if(rirRaro(LOG[id].rir)){ if(!rm && fila){ fila.insertAdjacentHTML('afterend', avisoRIR(id)); } }
  else if(rm) rm.remove();
}

/* --- confirmar / desmarcar una serie, sin tocar el resto --- */
function confirmar(id){
  const r=document.getElementById('r_'+id);
  const v = LOG[id] || {};
  if(v.ok){                                   // desmarcar
    LOG[id] = Object.assign({}, v, {ok:false});
  } else {
    if(!r.value.trim()){ toast(tr('Escribe al menos las repeticiones que hiciste.')); r.focus(); return; }
    anota(id);
    LOG[id].ok = true;
    LOG[id].ts = new Date().toISOString();
  }
  LS.set('log', LOG);
  const fila=document.getElementById('fila_'+id), btn=document.getElementById('b_'+id);
  if(fila) fila.classList.toggle('ok', !!LOG[id].ok);
  if(btn) btn.textContent = tr(LOG[id].ok ? 'Hecha' : 'Anotar');
}

function vaciar(id){
  const v = LOG[id] || {};
  ['r_','c_','i_'].forEach(p=>{ const el=document.getElementById(p+id); if(el) el.value=''; });
  const rm = document.getElementById('rm_'+id); if(rm) rm.remove();
  if(v.sent){
    // ya está en la hoja: se envía vacía para que allí quede corregida
    LOG[id] = {r:'', c:'', rir:'', ok:false, sent:true, corregido:true, borrada:true};
    toast(tr('Se corregirá en la hoja al enviar.'));
  } else {
    delete LOG[id];
  }
  LS.set('log', LOG);
  const fila=document.getElementById('fila_'+id), btn=document.getElementById('b_'+id);
  if(fila){ fila.classList.remove('ok'); if(LOG[id]) fila.classList.add('corr'); }
  if(btn) btn.textContent='Anotar';
}

function abrirNota(id){ S.nota=id; pinta();
  setTimeout(()=>{ const el=document.getElementById('n_'+id); if(el) el.focus(); },50); }
function cerrarNota(){ S.nota=null; pinta(); }
function guardaNota(id,txt){

  LOG[id] = Object.assign({}, prev, {nota:txt, ok:!!txt.trim()});

}

function anotaReg(id, cs){
  /* v5.2: se parte de lo que ya habia. Las escalas se pintan con botones,
     no con casillas, y antes se perdian al escribir en cualquier otra. */
  const prev = LOG[id] || {}, d = Object.assign({}, prev.d || {});
  cs.split('-').forEach(k=>{
    if(CAMPOS[k] && CAMPOS[k].hms){
      const q = x => { const el=document.getElementById('g_'+id+'_'+k+'_'+x); return el ? el.value : null; };
      if(q('m') !== null) d[k] = juntaTiempo(q('h'), q('m'), q('s'));
      return;
    }
    const el=document.getElementById('g_'+id+'_'+k); if(el) d[k]=el.value.trim(); });
  LOG[id] = Object.assign({}, prev, {d:d});
  if(prev.sent) LOG[id].corregido = true;
  LS.set('log', LOG);
  const r = document.getElementById('ritmo_'+id);
  if(r){ r.textContent = textoRitmo(d); r.classList.toggle('mal', !!d.km && !!aSegundos(d.tiempo) && !ritmoCreible(d)); }
  const va = document.getElementById('vam_'+id);
  if(va) va.textContent = textoVAM(d.vam, id);
}
/* Escala de botones: tocar el mismo numero lo quita, como las estrellas. */
function anotaEscala(id, k, n){
  const prev = LOG[id] || {}, d = Object.assign({}, prev.d || {});
  d[k] = (String(d[k]||'') === String(n)) ? '' : String(n);
  LOG[id] = Object.assign({}, prev, {d:d});
  if(prev.sent) LOG[id].corregido = true;
  LS.set('log', LOG);
  const C = CAMPOS[k] || {};
  for(let i=1;i<=(C.escala||5);i++){
    const b = document.getElementById('eb_'+id+'_'+k+'_'+i);
    if(b) b.classList.toggle('on', String(d[k]) === String(i));

}
function confirmarReg(id, cs){
  const v = LOG[id] || {};
  if(v.ok){
    LOG[id] = Object.assign({}, v, {ok:false});
  } else {
    anotaReg(id, cs);
    if(cs.split('-').indexOf('hecho') > -1) LOG[id].d = Object.assign({}, LOG[id].d, {hecho:'sí'});
    const d = LOG[id].d || {};
    if(!Object.keys(d).some(k=>d[k])){ toast(tr('Anota al menos un dato antes de confirmar.')); return; }
    LOG[id].ok = true;

  }

  if(caja) caja.classList.toggle('ok', !!LOG[id].ok);
  if(btn) btn.textContent = tr(cs==='hecho' ? (LOG[id].ok?'Hecho ✓':'Marcar como hecho') : (LOG[id].ok ? 'Hecha' : 'Anotar'));
  // v5.0: con la VAM confirmada, las series de abajo ya salen con su velocidad
  if(LOG[id].d && LOG[id].d.vam) pinta();
}
function valora(bl,dia,n){
  const id = idVal(bl,dia), prev = LOG[id] || {};
  const nuevo = (prev.val===n) ? 0 : n;      // tocar la misma estrella la quita
  LOG[id] = Object.assign({}, prev, {val:nuevo, ok:nuevo>0});
  if(prev.sent) LOG[id].corregido = true;
  LS.set('log', LOG);
  for(let i=1;i<=5;i++){
    const b=document.getElementById('est_'+id+'_'+i);
    if(b) b.classList.toggle('on', i<=nuevo);

function guardaObs(bl,dia,txt){

/* ================= ENVÍO ================= */
/* v5.11: AUTOENVIO. De Carmen no ha llegado nada en cinco semanas: lo mas
   probable es que anote y no toque nunca "Guardar y enviar". Ahora tambien se
   envia solo, sin que haga nada:
     - al valorar la sesion (las estrellas del final), y
     - al salir de la app (cambiar de app, bloquear el movil) si hay algo
       anotado sin enviar y hay cobertura.
   El boton "Guardar y enviar" se queda igual. El autoenvio NO manda el
   seguimiento semanal: a medio escribir no se da por respondido; eso sigue
   saliendo con su boton.
   enviar(opc): opc.auto = sin cambiar de pantalla; opc.salir = la pagina se
   esta yendo (keepalive, sin avisos). */
async function enviar(opc){
  opc = opc || {};
  // un envio que se quedo colgado (el movil durmio la app a medias) no bloquea para siempre
  if(S.enviando && Date.now() - (S.enviandoDesde||0) < 45000){ if(opc.auto) S.otraVez = true; return; }
  if(opc.auto && navigator.onLine === false) return;
  confirmaLoEscrito();      // v5.6: lo escrito cuenta, aunque no lleve "Anotar"
  const reg = [], hoy = new Date().toISOString().slice(0,10);
  /* v5.11: lo que sale, tal como sale. Al volver la respuesta solo se marca
     como enviado lo que no ha cambiado mientras tanto: con el autoenvio se
     sigue escribiendo mientras viaja el envio, y antes eso se daba por enviado
     sin haber salido nunca. */
  const foto = {};

  Object.keys(LOG).forEach(id=>{
    const v = LOG[id]; if(!v) return;
    // solo se manda lo confirmado, lo corregido o lo borrado
    if(id.endsWith('~fecha') || id.endsWith('~alt')) return;      // marcas internas: no son registros
    if(!v.ok && !v.corregido) return;
    if(v.sent && !v.corregido) return;
    foto[id] = JSON.stringify(v);

    const p = id.split('~');
    const base = {id:id, fecha:(v.ts||'').slice(0,10)||hoy,
                  semana:(p[0]||'').replace(/^s/,''), bloque:p[1]||'', dia:p[2]||'',
                  sesion:'', ejercicio:'', serie:'', reps:'', carga:'', rir:'', notas:'', estado:'',
                  km:'', tiempo:'', ritmo:'', rpe:'', piernas:'', valoracion:''};

    if(id.endsWith('~omitida')){ reg.push(Object.assign(base,{estado:v.borrada?'':'omitida'})); return; }
    if(id.endsWith('~extra')){
      const e = v.extra || {};
      reg.push(Object.assign(base,{ejercicio:'EXTRA · ' + (e.titulo||''),
        tiempo: e.min ? e.min + ' min' : '', rpe: e.int ? String(e.int) : '',
        notas: e.nota || '', estado: v.borrada ? '' : 'realizada'}));
      return;
    }
    if(id.endsWith('~salto')){
      reg.push(Object.assign(base,{ejercicio:nombreDe(id)||p[3]||'', estado:v.borrada?'':'omitida'}));
      return;
    }
    if(id.endsWith('~obs')){ reg.push(Object.assign(base,{ejercicio:'OBSERVACIONES', notas:v.obs||''})); return; }
    if(id.endsWith('~nota')){
      reg.push(Object.assign(base,{ejercicio:nombreDe(id)||p[3]||'', notas:v.nota||'', estado:'nota'}));
      return;
    }
    if(id.endsWith('~valoracion')){
      reg.push(Object.assign(base,{ejercicio:'VALORACIÓN DEL DÍA',
        valoracion: v.val ? String(v.val) : '', estado: v.val ? 'valorada' : ''}));
      return;
    }
    if(id.endsWith('~reg')){
      const d = v.d || {};
      reg.push(Object.assign(base,{ejercicio:nombreDe(id)||p[3]||'',
        km:d.km||'', tiempo:d.tiempo||'',
        /* v5.2: si lo escribio ella (con su unidad), manda lo suyo; si no, el
           ritmo que sale de km y tiempo. El avituallamiento va en notas: la
           hoja no tiene columna propia y asi Salvador lo lee con el resto. */
        notas: d.fuel ? tr('Avituallamiento') + ': ' + d.fuel : '',
        ritmo: d.vam ? 'VAM' + (vamDe(d.vam) ? ' ' + paso(vamDe(d.vam)) + ' min/km' : '')
                     : (d.ritmo || (ritmoCreible(d) ? ritmoDe(d).replace('Ritmo ','') : '')),
        rpe:d.rpe||'', piernas:d.piernas||'', carga:d.carga||'', reps:d.metros||d.vam||'',
        estado: v.borrada ? '' : (v.ok?'realizada':'')}));
      return;
    }

    if(/^e\d+$/.test(p[4]||'')){                 // v5.15: una estacion
      reg.push(Object.assign(base,{ejercicio:nombreDe(id)||((p[3]||'')+' · '+(v.est||'')), serie:p[4].slice(1),
        tiempo:v.t||'', carga:v.c||'', estado: v.borrada ? '' : 'realizada'}));
      return;
    }
    const serie = (p[4]||'').replace('s','');
    // Una serie de fuerza trae reps, kilos y RIR; una de carrera, tiempo y esfuerzo.
    // en libras: a CARGA van los kilos y lo que escribio, a NOTAS
    const enLb = v.u === 'lb' && num(v.c) > 0;
    reg.push(Object.assign(base,{ejercicio:nombreDe(id)||p[3]||'', serie:serie, reps:v.r||'',
      carga: enLb ? redondea(aKg(v.c,'lb')) : (v.c||''), notas: enLb ? v.c + ' lb' : '',
      rir:v.rir||'', tiempo:v.t||'', rpe:v.e||'', estado: v.borrada ? '' : (v.ok?'realizada':'')}));
  });

  // La semana que se está respondiendo es la que pide el aviso; si no hay
  // aviso pendiente, es la actual. Tiene que ser la misma en las tres partes:
  // el identificador, el dato que va a la hoja y la marca de "ya respondida".
  const semResp = (faltaCheckin() || S.semana || {}).SEMANA || '0';
  const chk = opc.auto ? [] : Object.keys(CHK).filter(k=>CHK[k] && (String(CHK[k].v||'').trim() || CHK[k].n)).map(k=>({
    id: idChk(semResp, k),
    fecha: hoy, semana: semResp, 'npregunta': k,
    categoria: CHK[k].cat||'',
    respuesta: (CHK[k].n ? CHK[k].n + '/5' + (String(CHK[k].v||'').trim() ? ' · ' : '') : '') + (CHK[k].v||'')
  }));

  if(!reg.length && !chk.length){ if(!opc.auto) toast(tr('No hay nada nuevo que enviar.')); return; }

  S.enviando = true; S.enviandoDesde = Date.now();
  if(!opc.auto) toast(tr('Enviando…'));
  const cuerpo = JSON.stringify({cliente:CID, token:KEY, registro:reg, checkin:chk});
  const ctrl = new AbortController(), reloj = setTimeout(()=>ctrl.abort(), 40000);
  try{
    // keepalive deja que el envio termine aunque se cierre la app (hasta 64 KB)
    const r = await fetch(API, {method:'POST', redirect:'follow', signal:ctrl.signal,
      keepalive: !!opc.salir && cuerpo.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: cuerpo});
    const d = await r.json();
    clearTimeout(reloj);
    if(d.error) throw new Error(d.error);

    // se conserva todo, marcado como enviado: así se puede corregir después
    Object.keys(foto).forEach(id=>{
      const v = LOG[id]; if(!v || JSON.stringify(v) !== foto[id]) return;
      if(v.borrada){ delete LOG[id]; return; }
      v.sent = true; delete v.corregido;
    });
    LS.set('log', LOG);

    if(chk.length){
      // v5.14: con el seguimiento respondido, el resumen de esa semana
      if(Object.keys(CHK).some(k=>/^p/.test(k))) S.resumen = resumenSemana(semResp);
      // la semana cuenta como respondida si va alguna pregunta, no solo las estrellas o las fotos
      if(Object.keys(CHK).some(k=>/^p/.test(k)) && !ENVIADO.includes(String(semResp))){
        ENVIADO.push(String(semResp)); LS.set('semanas_enviadas', ENVIADO);
      }
      CHK = {}; LS.set('checkin', CHK);   // el formulario queda limpio para la semana siguiente
    }
    S.enviando=false;
    if(opc.auto){
      if(!opc.salir && document.visibilityState !== 'hidden') toast(tr('Enviado. Salvador ya lo tiene.'));
    } else {
      S.vista = S.resumen ? 'resumen' : 'hoy'; window.scrollTo(0,0); pinta();
      const c = d.corregidas||0;
      toast(c ? `${tr('Enviado.')} ${c} ${tr(c>1?'datos corregidos.':'dato corregido.')}` : tr('Enviado. Salvador ya lo tiene.'));
    }
  }catch(e){
    clearTimeout(reloj);
    S.enviando=false;
    if(!opc.auto) toast(tr('No se ha podido enviar. Sigue guardado en tu móvil; inténtalo luego.'));
  }
  if(S.otraVez){ S.otraVez = false; if(pendientes()) enviar({auto:true}); }
}
/* Al salir de la app (otra app, pantalla bloqueada, cerrar): si hay algo sin enviar, sale solo. */
function enviarAlSalir(){
  if(!S.d || !CID || !KEY || !pendientes()) return;
  enviar({auto:true, salir:true});
}
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'hidden') enviarAlSalir(); });
window.addEventListener('pagehide', enviarAlSalir);


/* ================= v5.14 · GRAFICAS Y RESUMEN (fase 3) =================
   Todo sale de lo anotado en el movil (LOG), que incluye lo que el puente
   devuelve de la hoja. Una sola serie por grafica, en el verde de la marca;
   sin dos ejes; el dato exacto se ve al tocar el punto. */

/* La mejor serie de cada ejercicio, semana a semana.
   "Mejor" = la mas pesada (en kilos, aunque se anotara en libras); a igual
   peso, la de mas repeticiones. Sin carga (peso corporal): la de mas reps. */
function historialCargas(){
  const h = {};
  Object.keys(LOG).forEach(k=>{
    const v = LOG[k]; if(!v || !v.ok || v.borrada) return;
    const p = k.split('~'); if(p.length !== 5 || !/^s\d+$/.test(p[4])) return;
    if(!v.r && !v.c) return;
    const sem = parseInt(p[0].replace(/^s/,''), 10); if(isNaN(sem)) return;
    const it = {sem, kg:aKg(v.c, v.u), reps:parseFloat(String(v.r).replace(',','.'))||0, carga:v.c||'', u:v.u||'kg'};
    const e = h[p[3]] = h[p[3]] || {};
    const b = e[sem];
    if(!b || it.kg > b.kg || (it.kg === b.kg && it.reps > b.reps)) e[sem] = it;
  });
  return h;
}
const mejorQue = (a, b) => !b || a.kg > b.kg || (a.kg === b.kg && a.reps > b.reps);
const textoSerie = x => x.kg ? `${x.carga} ${x.u} × ${x.reps}` : `${x.reps} ${tr('reps')}`;
/* record = la mejor de todas; y si llego esta semana (o la semana dada) */
function recordDe(semanas){
  let r = null; Object.keys(semanas).forEach(s=>{ const x = semanas[s]; if(mejorQue(x, r)) r = x; }); return r;
}
function tt(el){
  const g = el.closest('.graf'); if(!g) return;
  const t = g.querySelector('.tt'); if(t) t.textContent = el.getAttribute('data-t') || '';
}
/* Linea de un ejercicio: x = semanas con datos, y = kilos (o reps sin carga) */
function graficaEjercicio(slugEj, nombre){
  const sems = (historialCargas()[slugEj]) || {};
  const ks = Object.keys(sems).map(Number).sort((a,b)=>a-b);
  if(!ks.length) return '';
  const conKg = ks.some(k=>sems[k].kg > 0);
  const val = x => conKg ? x.kg : x.reps;
  const ys = ks.map(k=>val(sems[k]));
  const rec = recordDe(sems);
  const W = 300, H = 96, L = 30, R = 30, T = 14, B = 18;
  let lo = Math.min(...ys), hi = Math.max(...ys);
  if(hi === lo){ lo = Math.max(0, lo - 1); hi = hi + 1; }
  const pad = (hi - lo) * .15; lo = Math.max(0, lo - pad); hi = hi + pad;
  const X = i => ks.length === 1 ? (L + (W-L-R)/2) : L + i * (W-L-R) / (ks.length-1);
  const Y = y => T + (H-T-B) * (1 - (y - lo) / (hi - lo));
  const fmt = n => String(Math.round(n*10)/10).replace('.', enIngles()?'.':',');
  const uni = conKg ? 'kg' : tr('reps');
  const pts = ks.map((k,i)=>({x:X(i), y:Y(ys[i]), k, d:sems[k]}));
  const ult = pts[pts.length-1];
  const etiqSem = k => (enIngles()?'W':'S') + k;
  const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(nombre)}: ${esc(ks.map(k=>etiqSem(k)+' '+fmt(val(sems[k]))+' '+uni).join(', '))}">
    <line class="rej" x1="${L}" x2="${W-R}" y1="${Y(hi - pad)}" y2="${Y(hi - pad)}"/>
    <line class="rej" x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}"/>
    <text class="eje" x="${L-6}" y="${Y(hi - pad)+3}" text-anchor="end">${fmt(hi - pad)}</text>
    ${Math.min(...ys) !== Math.max(...ys) ? `<line class="rej" x1="${L}" x2="${W-R}" y1="${Y(Math.min(...ys))}" y2="${Y(Math.min(...ys))}" stroke-dasharray="2 3"/>
      <text class="eje" x="${L-6}" y="${Y(Math.min(...ys))+3}" text-anchor="end">${fmt(Math.min(...ys))}</text>` : ''}
    ${pts.length > 1 ? `<polyline class="lin" points="${pts.map(p=>p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ')}"/>` : ''}
    ${pts.map(p=>`<circle class="pt${p.d === rec ? ' rec' : ''}" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4"/>`).join('')}
    ${pts.map((p,i)=>(ks.length <= 8 || i === 0 || i === pts.length-1 || i % 2 === 0)
        ? `<text class="eje" x="${p.x.toFixed(1)}" y="${H-4}" text-anchor="middle">${etiqSem(p.k)}</text>` : '').join('')}
    <text class="val" x="${(ult.x + 7).toFixed(1)}" y="${(ult.y + 3.5).toFixed(1)}">${fmt(val(ult.d))}</text>
    ${pts.map(p=>`<circle class="hit" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="14" tabindex="0"
        data-t="${esc(tr('Semana') + ' ' + p.k + ': ' + textoSerie(p.d) + (p.d === rec ? ' · ' + tr('récord') : ''))}"
        onclick="tt(this)" onfocus="tt(this)"/>`).join('')}
  </svg>`;
  return `<div class="gej"><div class="t"${/[A-ZÁÉÍÓÚ]/.test(nombre)?'':' style="text-transform:capitalize"'}>${esc(nombre)}</div>
    <div class="r">${tr('Récord')}: <b>${esc(textoSerie(rec))}</b> · ${tr('semana')} ${rec.sem}</div>
    <div class="graf">${svg}<div class="tt" aria-live="polite"></div></div></div>`;
}
/* Km por semana: barras, una por semana real del plan; la de hoy, mas fuerte */
function kmPorSemana(){
  const km = {};
  Object.keys(LOG).forEach(k=>{
    const v = LOG[k]; if(!v || !v.ok || v.borrada || !k.endsWith('~reg') || !v.d) return;
    const n = parseFloat(String(v.d.km||'').replace(',','.')) || 0; if(!n) return;
    const sem = parseInt(k.split('~')[0].replace(/^s/,''), 10); if(isNaN(sem)) return;
    km[sem] = (km[sem]||0) + n;
  });
  return km;
}
/* v5.18 (3 oct, peticion de la sesion de Smi con el visto bueno de Salvador): el
   plan detras de cada barra. Sale de KM PLAN en SEMANAS; quien no lo tenga ve la
   grafica como antes. Con plan, salen tambien las semanas que faltan (solo el
   contorno): la forma que queda hasta la carrera. */
const kmPlan = () => {
  const p = {};
  semanasReales().forEach(w=>{
    const n = parseInt(String(w.SEMANA).replace(/\D/g,''),10);
    const v = parseFloat(String(w['KM PLAN']||'').replace(',','.'));
    if(!isNaN(n) && v > 0) p[n] = v;
  });

};
function graficaKm(){
  const km = kmPorSemana(), plan = kmPlan(), hayPlan = Object.keys(plan).length > 0;
  const hoyN = parseInt(String((S.semana||{}).SEMANA||'').replace(/\D/g,''), 10);
  const sems = semanasReales().map(w=>parseInt(String(w.SEMANA).replace(/\D/g,''),10))
                 .filter(n=>!isNaN(n) && (n <= hoyN || km[n] || (hayPlan && plan[n])));
  if(sems.filter(n=>km[n]).length < 2) return '';
  const W = 300, H = 110, L = 6, R = 6, T = 16, B = 18;
  const max = Math.max(...sems.map(n=>Math.max(km[n]||0, plan[n]||0)));
  const paso = (W-L-R) / sems.length, ancho = Math.max(6, paso - 2);
  const fmt = n => String(Math.round(n*10)/10).replace('.', enIngles()?'.':',');
  const barras = sems.map((n,i)=>{
    const v = km[n]||0, h = max ? (H-T-B) * v / max : 0, x = L + i*paso + (paso-ancho)/2, y = H-B-h;
    const r = Math.min(4, ancho/2, h/2);
    const path = h > 0 ? `M${x},${H-B} V${y+r} Q${x},${y} ${x+r},${y} H${x+ancho-r} Q${x+ancho},${y} ${x+ancho},${y+r} V${H-B} Z` : '';
    const pl = plan[n] || 0, hp = max ? (H-T-B) * pl / max : 0;
    const fantasma = pl ? `<rect class="plan" x="${x+.6}" y="${H-B-hp}" width="${Math.max(0,ancho-1.2)}" height="${hp}" rx="${Math.min(4, ancho/2)}"/>` : '';
    const etq = v ? fmt(v) : (pl && n > hoyN ? fmt(pl) : '');
    const yEt = v ? y : H-B-hp;
    const dato = tr('Semana') + ' ' + n + ': ' + (pl ? (v ? fmt(v) + ' ' + tr('de los') + ' ' + fmt(pl) + ' km ' + tr('del plan') : tr('plan') + ' ' + fmt(pl) + ' km')
                                                     : fmt(v) + ' km');
    return `${fantasma}${path?`<path class="bar${n===hoyN?' hoy':''}" d="${path}"/>`:''}
      ${etq && (sems.length <= 8 || n === hoyN || v === max) ? `<text class="val${v?'':' fut'}" x="${x+ancho/2}" y="${yEt-4}" text-anchor="middle">${etq}</text>` : ''}
      <text class="eje" x="${x+ancho/2}" y="${H-4}" text-anchor="middle">${(enIngles()?'W':'S') + n}</text>
      <rect class="hit" x="${L+i*paso}" y="${T-14}" width="${paso}" height="${H-T-B+14}" tabindex="0"
        data-t="${esc(dato)}" onclick="tt(this)" onfocus="tt(this)"/>`;
  }).join('');
  const leyenda = hayPlan ? `<div class="leyenda"><span class="lb"></span>${tr('lo que has corrido')}<span class="lp"></span>${tr('el plan')}</div>` : '';
  return `<div class="lbl" style="margin-top:14px">${tr('Km por semana')}</div>
    <div class="graf"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(tr('Km por semana') + ': ' + sems.map(n=>'S'+n+' '+fmt(km[n]||0) + (plan[n] ? ' / ' + fmt(plan[n]) : '')).join(', '))}">
      <line class="rej" x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}"/>${barras}</svg>${leyenda}<div class="tt" aria-live="polite"></div></div>`;
}
/* Los records de esta semana: ejercicios cuya mejor serie de la semana supera
   a todas las anteriores (hace falta haberlo hecho alguna semana antes). */
function recordsDeSemana(n){
  const h = historialCargas(), out = [];
  Object.keys(h).forEach(e=>{
    const sems = h[e], x = sems[n]; if(!x) return;
    const antes = Object.keys(sems).map(Number).filter(k=>k < n);
    if(!antes.length) return;
    const prev = recordDe(Object.fromEntries(antes.map(k=>[k, sems[k]])));
    if(mejorQue(x, prev) && !(x.kg === prev.kg && x.reps === prev.reps)) out.push({e, x, prev});
  });
  return out;
}

/* ---------- resumen de la semana, al enviar el seguimiento ---------- */
function resumenSemana(semana){
  const n = parseInt(String(semana).replace(/\D/g,''), 10), pre = 's' + slug(String(semana)) + '~';
  const ses = new Set(); let kilos = 0, km = 0, series = 0;
  Object.keys(LOG).forEach(k=>{
    if(k.indexOf(pre) !== 0) return;
    const v = LOG[k]; if(!v || !v.ok || v.borrada) return;
    const p = k.split('~');
    if(p.length === 5 && /^s\d+$/.test(p[4]) && (v.r || v.c || v.t || v.e)){
      ses.add(p[1]+'~'+p[2]); series++;
      kilos += aKg(v.c, v.u) * (parseFloat(String(v.r).replace(',','.')) || 0);
    } else if(k.endsWith('~reg') && v.d){
      ses.add(p[1]+'~'+p[2]);
      km += parseFloat(String(v.d.km||'').replace(',','.')) || 0;
    } else if(k.endsWith('~valoracion') && v.val) ses.add(p[1]+'~'+p[2]);
  });
  return {semana, sesiones:ses.size, kilos:Math.round(kilos), km:Math.round(km*10)/10, series,
          records: isNaN(n) ? [] : recordsDeSemana(n)};
}

    const it = {sem:parseInt(p[0].replace(/^s/,''))||0, c:aKg(v.c, v.u),

    const e = porEj[p[3]] = porEj[p[3]] || {n:0, prim:null, mejor:null};
    e.n++;
    if(!e.prim || it.sem < e.prim.sem) e.prim = it;
    if(!e.mejor || it.c > e.mejor.c || (it.c === e.mejor.c && (parseFloat(it.reps)||0) > (parseFloat(e.mejor.reps)||0))) e.mejor = it;
  });

/* Todas las fotos de progreso que constan: las del servidor y las que este

function fotosProg(){
  const m = {};
  (S.d.MIS_VIDEOS||[]).forEach(x=>{ const id = String(x.ID||'');
    if(id.startsWith('progreso~')) m[id] = String(x.FECHA||'').slice(0,10) || id.split('~')[1]; });
  Object.keys(VID).forEach(id=>{
    if(id.startsWith('progreso~') && VID[id].estado==='enviado') m[id] = m[id] || VID[id].fecha || id.split('~')[1]; });
  return m;
}
/* El ciclo abierto: la fecha de la primera foto de los ultimos 28 dias, o hoy
   si no hay ninguna. Y si ese ciclo ya tiene las tres. */
function cicloFotos(){
  const m = fotosProg();
  const claves = [...new Set(Object.keys(m).map(id=>id.split('~')[1]))].sort();
  const vivas = claves.filter(c=>diasDesde(c) < FOTOS_DIAS);
  const clave = vivas.length ? vivas[0] : hoyISO();
  const hechas = POSES.filter(([k])=>m[`progreso~${clave}~${k}`]).length;
  return {clave, hechas, completo: hechas === POSES.length};
}
const idProg = (clave, pose) => `progreso~${clave}~${pose}`;
const fotoProgEnviada = id => !!fotosProg()[id];
const fotosPendientes = () => fotosActivas() && !LS.get('fotos_no', false) && !cicloFotos().completo;

function avisoFotos(){
  if(!fotosPendientes()) return '';
  const c = cicloFotos();
  return `<div class="aviso">
    <b>📸 ${tr("Toca hacerte las fotos de progreso")}</b>
    <p class="mut" style="margin-top:6px;font-size:14px">${c.hechas
      ? tr("Te falta alguna de las tres. Cuando puedas, termínalas.")
      : tr("Tres fotos, frontal, lateral y posterior. Hazlas cuanto antes y no te las vuelvo a pedir hasta dentro de 4 semanas.")}</p>
    <button class="btn sm2" style="margin-top:10px" onclick="ir('fotos')">${tr("Ver cómo hacerlas")}</button>
  </div>`;
}
function vFotos(){
  const volver = `<div class="card flat"><button class="btn sm2" onclick="ir('hoy')">${tr("← Volver")}</button></div>`;
  if(!fotosActivas()) return volver;
  const cab = `<div class="card"><h2 style="font-size:19px">${tr("Fotos de progreso")}</h2>`;
  if(LS.get('fotos_no', false)) return volver + `${cab}
      <p class="mut" style="margin-top:8px">${tr("Has decidido no mandar fotos de progreso.")}</p>
      <button class="btn sm2" style="margin-top:10px" onclick="fotosNo(false)">${tr("Cambiar de idea")}</button></div>`;
  const c = cicloFotos();
  const reglas = ["Mismo sitio, misma luz y misma distancia cada vez. Luz de frente, nunca a contraluz, y fondo liso si puedes.",
    "Móvil en vertical, apoyado a la altura de la cadera y a 2-3 metros, con temporizador o que te la haga alguien. Que se te vea de la cabeza a los pies.",
    "En traje de baño o ropa interior, y siempre el mismo: es lo que deja ver el cambio.",
    "Antes de entrenar, nunca justo después: el bombeo cambia la foto. Mejor por la mañana, al levantarte.",
    "Postura natural: brazos relajados a los lados, sin meter tripa, sin apretar y sin posar."];
  return volver + `${cab}
    <p class="mut" style="margin-top:8px">${tr(c.completo
      ? "Ya tengo las tres de este mes. Te las vuelvo a pedir dentro de 4 semanas."
      : "Tres fotos, frontal, lateral y posterior. Son voluntarias.")}</p>
    <p class="sm" style="margin:8px 0">${tr("Son para ver tu cambio con el tiempo, no para juzgarte. Solo las veo yo: se guardan en mi Drive, no se comparten ni se publican.")}</p>
    <div class="calent" style="margin:10px 0"><b>${tr("Para que se puedan comparar, las tres, y cada mes, igual:")}</b>
      <ul style="margin:6px 0 0 18px;padding:0">${reglas.map(r=>`<li style="margin-bottom:4px">${tr(r)}</li>`).join('')}</ul></div>
    ${POSES.map(([k,et,como])=>{
      const id = idProg(c.clave, k), v = VID[id] || {}, hecha = fotoProgEnviada(id);
      return `<div style="margin:12px 0"><b>${tr(et)}</b> <span class="sm">· ${tr(como)}</span>
        <input type="file" accept="image/*" id="vf_${id}" style="display:none"
          onchange="subirFotoProgreso('${id}','${k}',this)">
        ${v.estado === 'enviando'
          ? `<p class="pista">⏳ ${tr("Enviando la foto…")}</p>`
          : `<div><button class="btn sm2${hecha?'':' pri'}" style="margin-top:6px" onclick="document.getElementById('vf_${id}').click()">📸 ${
              tr(hecha ? "Cambiar esta foto" : "Hacer o elegir la foto")}</button>
             ${hecha ? `<span class="sm"> ✅ ${tr("Foto enviada")}</span>` : ''}</div>`}</div>`;
    }).join('')}
    ${c.completo ? '' : `<button class="btn sm2" style="margin-top:6px" onclick="fotosNo(true)">${tr("Prefiero no mandar fotos")}</button>`}</div>`;
}
function fotosNo(no){
  LS.set('fotos_no', !!no);
  if(no){
    CHK.fotos = {cat:'Fotos', v:tr('Prefiere no mandar fotos de progreso')};
    toast(tr("Sin problema. No te las vuelvo a pedir; si cambias de idea, lo tienes aquí."));
  } else delete CHK.fotos;
  LS.set('checkin', CHK); pinta();
}
/* La foto se reduce en el movil antes de salir (lado largo 1600 px, JPEG):
   sube en segundos con poca cobertura y, al redibujarla, pierde los datos
   EXIF, entre ellos la ubicacion GPS de donde se hizo. */
function reducirFoto(f){
  return new Promise((ok, fail)=>{
    const url = URL.createObjectURL(f), img = new Image();
    img.onload = ()=>{
      const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth*k); c.height = Math.round(img.naturalHeight*k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg', 0.85).split(',')[1]);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); fail(new Error('foto')); };
    img.src = url;
  });
}
async function subirFotoProgreso(id, pose, input){
  const f = input.files && input.files[0];
  input.value = '';
  if(!f) return;
  if(f.size > 25 * 1024 * 1024){ toast(tr("Esa foto pesa demasiado.")); return; }
  VID[id] = {estado:'enviando'}; LS.set('videos', VID); pinta();
  try{
    const datos = await reducirFoto(f);
    const r = await fetch(API, {method:'POST', redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({cliente:CID, token:KEY, video:{
        id: id, tipo: 'progreso', fecha: hoyISO(), semana: String((S.semana&&S.semana.SEMANA)||''), dia: '',
        sesion: 'Fotos de progreso', ejercicio: 'FOTO DE PROGRESO · ' + pose, nota: '',
        mime: 'image/jpeg', nombre: 'progreso-' + pose + '.jpg', datos: datos}})});
    const d = await r.json();
    if(d.error) throw new Error(d.error);
    VID[id] = {estado:'enviado', fecha: hoyISO()};
  }catch(e){
    VID[id] = {estado:'error'};
    toast(tr("No se ha podido enviar la foto. Inténtalo otra vez con cobertura."));
  }
  LS.set('videos', VID); pinta();
}
function respQ(clave,cat,v){ CHK[clave]=Object.assign({},CHK[clave],{v:v,cat:cat}); LS.set('checkin',CHK); }
/* v3.14: las preguntas que piden un numero del 1 al 5 se contestan con un
   boton. Escribir "4" en un cuadro de texto era lento y luego no se podia
   comparar una semana con otra. El cuadro de texto se queda igual, para
   contar lo que quiera. */
/* v4.5: vale "1-5", "1 al 5" y "1 to 5": las hojas en ingles tambien.
   21 sep: y tambien las escalas con sus extremos escritos, "1 = wrecked,
   5 = fully recovered", que es como quedaron tras la v5.2. Sin esto, a Smi
   le desaparecian los botones en tres de sus nueve preguntas. */
const esEscala = t => /\b1\s*(?:[-–—]|\s*(?:al|to|a)\s*)\s*5\b/i.test(String(t||'')) ||
                      /\b1\s*=[^]{1,60}?\b5\s*=/i.test(String(t||''));
function valoraSeg(n){
  const a = CHK.valoracion || {}, nuevo = a.n === n ? 0 : n;
  if(nuevo) CHK.valoracion = {cat:'Valoración del seguimiento', n:nuevo, v:''};
  else delete CHK.valoracion;
  LS.set('checkin', CHK);
  for(let i=1;i<=5;i++){ const b=document.getElementById('estseg_'+i); if(b) b.classList.toggle('on', i<=nuevo); }
}
function notaQ(clave,cat,n){
  const a = CHK[clave] || {};
  CHK[clave] = Object.assign({}, a, {cat:cat, n: a.n===n ? 0 : n, v: a.v||''});
  LS.set('checkin',CHK); pinta();
}

  gs.forEach(g=>{ (grupos[g.CLAVE] = grupos[g.CLAVE] || {t:g['TÍTULO'], filas:[]}).filas.push(g); });

  return `
  <div class="card flat"><button class="btn sm2" onclick="ir('plan')">${tr("← Mi plan")}</button></div>
  ${Object.keys(grupos).map(k=>{
    const g = grupos[k];
    return `<div class="card"><h3 style="margin-bottom:12px">${esc(g.t)}</h3>
      ${g.filas.map(f=>`<div class="guia"><div class="p">${esc(f.PUNTO)}</div>
        <div class="c">${esc(f.CONTENIDO)}</div></div>`).join('')}</div>`;
  }).join('')}
  ${textos.map(t=>`<div class="card"><h3>${esc(t['TÍTULO'])}</h3>

}
