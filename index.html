<script>
/* Android: cada cliente instala su propio manifest, para que el icono abra
   directamente su plan y no la pagina generica. */
(function(){
  var c = (new URLSearchParams(location.search).get('c') || '').toLowerCase().replace(/[^a-z0-9_-]/g,'');
  if(!c) return;
  var l = document.createElement('link');
  l.rel = 'manifest'; l.href = 'manifest-' + c + '.json';
  document.head.appendChild(l);
})();
</script>

<style>
:root{
  --verde:#2F6B4A; --verde-c:#5E9A72; --verde-s:#C9D9CD; --verde-b:#EFF4F0;
  --papel:#F1EDE6; --sup:#FFFDFA; --sup2:#EDE7DD; --linea:#E2DCD2; --linea2:#D8D1C6;
  --txt:#4A463C; --txt2:#5E574C; --txt3:#8A8272;
  --rojo:#B03A3A; --rojo-s:#F8E4E1; --ambar:#8A6A1E; --ambar-s:#F6EDD7;
  --r:12px; --f:"IBM Plex Sans",system-ui,-apple-system,sans-serif; --m:"IBM Plex Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--f);background:var(--papel);color:var(--txt);font-size:16px;line-height:1.5;
  padding-bottom:env(safe-area-inset-bottom);overscroll-behavior-y:none}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--verde-c);outline-offset:2px;border-radius:6px}

/* cabecera */
.top{background:var(--verde);color:#F6F3EE;padding:calc(env(safe-area-inset-top) + 14px) 18px 14px;
  position:sticky;top:0;z-index:20}
.top .wm{font-weight:700;letter-spacing:.22em;font-size:13px}
.top .nm{font-size:13px;opacity:.82;margin-top:2px}
.top .rowt{display:flex;align-items:center;justify-content:space-between;gap:12px}
.pill{font-size:11px;font-weight:600;letter-spacing:.04em;background:rgba(246,243,238,.16);
  border:1px solid rgba(246,243,238,.28);border-radius:99px;padding:3px 9px;white-space:nowrap}

/* estructura */
main{padding:16px 14px 96px;max-width:640px;margin:0 auto}
.card{background:var(--sup);border:1px solid var(--linea);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card.flat{background:none;border:0;padding:0}
h2{font-size:21px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
h3{font-size:16px;font-weight:600}
.lbl{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--txt3)}
.mut{color:var(--txt2);font-size:14.5px}
.sm{font-size:13px;color:var(--txt3)}
.mono{font-family:var(--m);font-size:13px}
.row{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.sp{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
hr{border:0;border-top:1px solid var(--linea);margin:14px 0}

/* semáforo */
.sem{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;
  border-radius:99px;padding:3px 10px 3px 8px;border:1px solid;white-space:nowrap}
.sem i{font-style:normal;font-size:9px;line-height:1}
.sem.rojo{background:var(--rojo-s);border-color:#E2B0AA;color:var(--rojo)}
.sem.ambar{background:var(--ambar-s);border-color:#E0C588;color:var(--ambar)}
.sem.verde{background:var(--verde-b);border-color:var(--verde-s);color:var(--verde)}
.sem.gris{background:var(--sup2);border-color:var(--linea2);color:var(--txt3)}

/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--sup);
  border:1px solid var(--linea2);border-radius:10px;padding:10px 16px;font-size:15px;font-weight:600;
  color:var(--txt);cursor:pointer;min-height:44px}
.btn:active{transform:scale(.985)}
.btn.pri{background:var(--verde);border-color:var(--verde);color:#F6F3EE}
.btn.big{width:100%;padding:15px;font-size:16.5px;border-radius:12px}
.btn.sm2{padding:6px 12px;font-size:13.5px;min-height:36px;border-radius:8px}
.btn:disabled{opacity:.45}

/* día */
.dia{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--linea);
  width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0;cursor:pointer}
.dia:last-child{border-bottom:0}
.dia .d{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--txt3);
  width:42px;flex:none;padding-top:3px}
.dia .n{font-weight:600;font-size:15px;line-height:1.3}
.dia.hoy .n{color:var(--verde)}

/* ejercicio */
.ej{border:1px solid var(--linea);border-radius:var(--r);background:var(--sup);margin-bottom:10px;overflow:hidden}
.ej>.h{padding:13px 14px;display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.ej .nm{font-weight:600;font-size:15.5px;line-height:1.3}
.ej .ds{font-family:var(--m);font-size:12.5px;color:var(--txt3);margin-top:3px}
.ej .cue{font-size:13.5px;color:var(--txt2);padding:0 14px 12px;line-height:1.45}
.ej .cue p{margin:0 0 9px}
.ej .cue p:last-child{margin-bottom:0}
.ej .cue b{color:var(--txt);font-weight:600}
.ej .sets{padding:0 10px 10px;display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:22px 1fr 1fr 52px 78px;gap:6px;align-items:center}
.set .i{font-family:var(--m);font-size:12px;color:var(--txt3);text-align:center}
.set input{border:1px solid var(--linea2);border-radius:8px;padding:9px 8px;font-size:16px;width:100%;
  background:var(--sup);text-align:center;min-height:42px}
.set.ok{background:var(--verde-b);border-radius:8px;padding:3px 2px}
.set.ok input{border-color:var(--verde-s);background:transparent}
.set button{border:1px solid var(--verde);background:var(--verde);color:#F6F3EE;border-radius:8px;
  padding:9px 4px;font-size:13px;font-weight:600;min-height:42px;cursor:pointer}
.set.ok button{background:transparent;color:var(--verde);border-color:var(--verde-s)}
.calent{background:var(--sup2);border-radius:var(--r);padding:13px 14px;margin-bottom:12px;font-size:14px;color:var(--txt2)}
.extra-sep{margin:22px 0 12px;padding:13px 14px;border:1px dashed var(--linea2);border-radius:var(--r);background:transparent}
.extra-sep b{display:block;color:var(--txt);font-size:15px}
.extra-sep p{margin-top:5px;font-size:13.5px;color:var(--txt3);line-height:1.45}
.reg{padding:0 14px 12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.reg .c{display:flex;flex-direction:column;gap:4px}
.reg .c label{font-family:var(--m);font-size:11px;color:var(--txt3);text-transform:uppercase;letter-spacing:.5px}
.reg input{border:1px solid var(--linea2);border-radius:8px;padding:9px 8px;font-size:16px;width:100%;
  background:var(--sup);color:var(--txt);font-family:var(--m)}
.reg .c.ancho{grid-column:1/-1}
.reg .totales{grid-column:1/-1;font-family:var(--m);font-size:11px;letter-spacing:.5px;
  text-transform:uppercase;color:var(--txt3)}
.set.corre{grid-template-columns:22px 1fr 1fr 78px 26px}
.masseries{padding:0 14px 10px}
.masseries button{border:1px dashed var(--linea2);background:transparent;color:var(--txt2);
  border-radius:9px;padding:8px 10px;font-size:13px;width:100%}
.reg .ayuda{margin:3px 0 0;font-size:11.5px;line-height:1.35;color:var(--txt3)}
.reg .escala{margin:0}
.reg .escala button{padding:9px 0;font-size:15px}
.reg .ritmo{grid-column:1/-1;font-family:var(--m);font-size:12.5px;color:var(--verde);min-height:16px}
.reg button{grid-column:1/-1;border:1px solid var(--verde);background:var(--verde);color:#F6F3EE;
  border-radius:8px;padding:11px;font-size:14px;font-weight:600}
.reg.ok{background:var(--verde-b);margin:0 10px 12px;padding:12px;border-radius:10px}
.reg.ok input{border-color:var(--verde-s);background:transparent}
.valora{margin-top:16px;padding-top:14px;border-top:1px solid var(--linea)}
.estrellas{display:flex;gap:6px;margin-top:9px}
.estrellas button{flex:1;border:1px solid var(--linea2);background:var(--sup);border-radius:9px;
  padding:9px 0;font-size:20px;line-height:1;filter:grayscale(1);opacity:.45}
.estrellas button.on{border-color:var(--verde);background:var(--verde-b);filter:none;opacity:1}
.escala{display:flex;gap:6px;margin:4px 0 2px}
.escala button{flex:1;border:1px solid var(--linea2);background:var(--sup);border-radius:9px;
  padding:10px 0;font-size:16px;font-weight:600;color:var(--txt2);cursor:pointer;min-height:44px;font-family:var(--m)}
.escala button.on{border-color:var(--verde);background:var(--verde);color:#F6F3EE}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sup);border-top:1px solid var(--linea);
  display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:30}
nav button{flex:1;background:none;border:0;padding:9px 2px 10px;display:flex;flex-direction:column;
  align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--txt3);cursor:pointer;min-height:56px}
nav button[aria-current]{color:var(--verde)}
nav .g{font-size:17px;line-height:1}

/* varios */
.load{padding:60px 20px;text-align:center;color:var(--txt3)}
.spin{width:26px;height:26px;border:2.5px solid var(--linea2);border-top-color:var(--verde);
  border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}
.toast{position:fixed;left:14px;right:14px;bottom:78px;background:var(--txt);color:var(--papel);
  padding:12px 16px;border-radius:10px;font-size:14px;font-weight:500;z-index:40;text-align:center;
  box-shadow:0 8px 24px -8px rgba(0,0,0,.4)}
.err{background:var(--rojo-s);border:1px solid #E2B0AA;color:var(--rojo);border-radius:var(--r);padding:14px}
.guia{border-left:3px solid var(--verde-s);padding-left:13px;margin-bottom:12px}
.guia .p{font-weight:600;font-size:14px}
.guia .c{font-size:14px;color:var(--txt2);line-height:1.45}
.q{border-bottom:1px solid var(--linea);padding:13px 0}
.q:last-child{border-bottom:0}
.q .t{font-size:14.5px;font-weight:500;line-height:1.4;margin-bottom:8px}
.q textarea{width:100%;border:1px solid var(--linea2);border-radius:8px;padding:10px;font-size:16px;
  min-height:70px;background:var(--sup);resize:vertical;line-height:1.4}
.bar{height:7px;background:var(--sup2);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.bar>i{display:block;height:100%;background:var(--verde-c);border-radius:99px}
.tag{display:inline-block;font-size:11px;font-weight:600;background:var(--sup2);color:var(--txt2);
  border-radius:6px;padding:2px 7px;margin-right:5px}
/* --- v3 --- */
.aviso{background:var(--ambar-s);border:1px solid #E0C588;border-radius:var(--r);padding:14px;margin-bottom:12px}
.aviso b{color:var(--ambar)}
.vid{position:relative;width:100%;background:#000;border-radius:10px;overflow:hidden;margin:0 14px 12px;width:calc(100% - 28px)}
.vid iframe{width:100%;aspect-ratio:9/16;max-height:60vh;display:block;border:0}
.vid.h iframe{aspect-ratio:16/9}
.verej{background:none;border:1px solid var(--linea2);border-radius:8px;padding:7px 12px;font-size:13px;
  font-weight:600;color:var(--verde);cursor:pointer;margin:0 14px 12px;display:inline-flex;gap:6px;
  align-items:center;text-decoration:none}
.set{grid-template-columns:16px minmax(0,1fr) minmax(0,1fr) 40px 56px 26px;gap:4px}
.set input{min-width:0;padding:9px 4px}
.set button.x{background:none!important;border:0;color:var(--txt3);font-size:16px;padding:6px 0;
  cursor:pointer;min-height:42px;font-weight:400}
.set.ok button.x{color:var(--verde)}
.set button:not(.x){padding:9px 2px;font-size:12.5px}
.set.sent input{border-style:dashed}
.sync{font-size:11px;font-weight:600;color:var(--verde);letter-spacing:.03em}
/* Sesión ya registrada: se distingue de un vistazo y no invita a repetirse */
.dia.hecha{opacity:.62}
.dia.hecha .n{text-decoration:line-through;text-decoration-color:var(--linea2);text-decoration-thickness:1px}
.dia.hecha .d{color:var(--verde)}
.yahecha{background:var(--verde-b);border:1px solid var(--verde-s);border-radius:var(--r);padding:13px 14px;margin-bottom:12px}
/* Nota del cliente sobre un ejercicio concreto */
.notaej{margin:0 14px 12px}
.notaej button.abrir{background:none;border:0;padding:6px 0;font-size:13px;font-weight:600;
  color:var(--txt3);cursor:pointer;display:flex;align-items:center;gap:6px;text-align:left}
.notaej button.abrir:hover{color:var(--verde)}
.notaej button.abrir .tocar{color:var(--verde);text-decoration:underline;text-underline-offset:3px;
  font-weight:600;white-space:nowrap}
.verej .tocar, .nohecho button .tocar{color:var(--verde);text-decoration:underline;
  text-underline-offset:3px;font-weight:600;white-space:nowrap}
.dia .tocar{color:var(--verde);text-decoration:underline;text-underline-offset:3px;font-weight:600}
.notaej button.abrir.con{color:var(--verde)}
.notaej textarea{width:100%;border:1px solid var(--linea2);border-radius:8px;padding:10px;
  font-size:16px;min-height:64px;background:var(--sup);resize:vertical;line-height:1.4;margin-top:4px}
.notaej .pista{font-size:12px;color:var(--txt3);margin-top:5px}
.yahecha b{color:var(--verde)}
.corr{background:var(--ambar-s);border-radius:8px;padding:3px 2px}
/* "este ejercicio no lo he hecho": discreto, pero a mano */
.extra{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--linea)}
.extra:last-of-type{border-bottom:0}
.extra button{background:none;border:0;color:var(--txt3);font-size:16px;cursor:pointer;padding:2px 4px}
.campo{width:100%;border:1px solid var(--linea2);border-radius:8px;padding:10px;font-size:16px;
  background:var(--sup);margin-top:5px;color:var(--txt)}
.tagb{background:var(--sup2);border:1px solid var(--linea2);border-radius:99px;padding:6px 12px;
  font-size:13px;color:var(--txt2);cursor:pointer}
.nohecho{padding:0 14px 12px;text-align:right}
.nohecho button{background:none;border:0;padding:4px 0;font-size:12.5px;color:var(--txt3);
  cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.saltado{margin:0 14px 12px;background:var(--sup2);border-radius:8px;padding:8px 10px;
  font-size:13px;color:var(--txt2);display:flex;justify-content:space-between;align-items:center;gap:8px}
.saltado button{background:none;border:0;font-size:13px;font-weight:600;color:var(--verde);
  cursor:pointer;text-decoration:underline;text-underline-offset:3px}
/* Lo que levanto la ultima vez: para no tener que acordarse ni buscarlo */
.ultima{margin:0 14px 11px;font-size:12.5px;color:var(--verde);background:var(--verde-b);
  border:1px solid var(--verde-s);border-radius:8px;padding:6px 10px}
.ultima b{font-family:var(--m);font-size:12.5px}
</style>

<div id="app"><div class="load"><div class="spin"></div>Cargando tu plan…</div></div>
<script>
/* ==================================================================
   SALVA · app de cliente — MAESTRO v4
   Una sola app y un solo puente para todos. Quién es y su llave vienen
   en su propio enlace:
       .../?c=alexia&k=SU-CLAVE
   Para dar de alta a alguien NO se toca este archivo: se añade una fila
   en la hoja "SALVA - Clientes" y se le manda su enlace.
   ================================================================== */

const API = 'https://script.google.com/macros/s/AKfycbyfsTcjZeECd0Pj3ClrJUqGulma3RBEMcOksb_CAqGIOlGUhNoNfCKDzY35hU73ItDX/exec';

const VERSION = 'v5.4';
const ANIO = 2026;

/* ---------- cliente activo ---------- */
const qs = new URLSearchParams(location.search);
const CID = (qs.get('c') || '').trim().toLowerCase();
const KEY = (qs.get('k') || '').trim();

/* ---------- estado ---------- */
const S = { d:null, vista:'hoy', dia:null, semana:null, mirando:null, err:null, toast:null, enviando:false, cache:null, video:null, nota:null, videoAviso:null, extraAbre:null, extraTmp:null };
const K = k => 'salva_' + CID + '_' + k;
const LS = {
  get(k,f){ try{ return JSON.parse(localStorage.getItem(K(k))) ?? f; }catch(e){ return f; } },
  set(k,v){ try{ localStorage.setItem(K(k),JSON.stringify(v)); }catch(e){} }
};
let LOG = LS.get('log', {});          // { id: {r,c,rir,ok,sent,...} }
let CHK = LS.get('checkin', {});
let VID = LS.get('videos', {});
let ENVIADO = LS.get('semanas_enviadas', []);   // semanas cuyo check-in ya mandó

/* ---------- utilidades ---------- */
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const DIAS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
/* v4.3: la hoja de un cliente en inglés trae los días y los meses en inglés.
   La app entiende los dos idiomas; para los clientes en español no cambia
   nada, porque los nombres españoles siguen valiendo igual. */
const DIAS_EN = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const hoyNombres = () => { const i = new Date().getDay(); return [DIAS[i], DIAS_EN[i]].map(norm); };
const MESES = {ene:0,feb:1,mar:2,abr:3,may:4,jun:5,jul:6,ago:7,sep:8,oct:9,nov:10,dic:11,
               jan:0,apr:3,aug:7,dec:11};
const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
const slug = s => norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40);

/* --- Limpieza de lo que viene de la hoja -------------------------
   Las hojas traen números con decimales ("45.0") y textos que a veces
   repiten la misma idea dos veces. Se arregla al mostrar, no tocando
   los datos: la hoja sigue siendo la fuente.                      */
const fmtMin = v => {
  const t = String(v||'').trim();
  if(!t) return '';
  const n = parseFloat(t.replace(',','.'));
  return isNaN(n) ? t : String(Math.round(n)) + ' min';
};
/* "Inicio parcial — INICIO PARCIAL" -> "Inicio parcial" */
function sinRepetir(txt){
  const t = String(txt||'').trim();
  const p = t.split(/\s+[—–-]\s+/);
  if(p.length<2) return t;
  const vistos = [];
  p.forEach(x=>{ if(x && !vistos.some(v=>norm(v)===norm(x))) vistos.push(x.trim()); });
  return vistos.join(' · ');
}
/* Parte "Fuerza cuerpo completo — Fuerza de apoyo al HYROX" en
   título ("Fuerza cuerpo completo") y aclaración, que va debajo en
   pequeño. Se parte ANTES de deduplicar: si no, se pierde el guion. */
function partir(txt){
  const t = String(txt||'').trim();
  const p = t.split(/\s+[—–]\s+/);
  if(p.length<2) return {t:sinRepetir(t), sub:''};
  const a = p[0].trim();
  const b = p.slice(1).join(' · ').trim();
  if(!b || norm(a)===norm(b) || norm(b).includes(norm(a))) return {t:a, sub:''};
  return {t:a, sub:b};
}

function toast(msg){ S.toast=msg; pinta(); clearTimeout(toast.t); toast.t=setTimeout(()=>{S.toast=null;pinta();},3000); }

function fechaIni(txt){
  const s = String(txt||'');
  const n = s.match(/(\d{1,2})/), m = s.match(/([a-záéíóúñ]{3,})/i);
  if(!n||!m) return null;
  const x = MESES[norm(m[1]).slice(0,3)];
  return x===undefined ? null : new Date(ANIO, x, parseInt(n[1]));
}
function semanaActual(){
  const ss = S.d.SEMANAS||[]; if(!ss.length) return null;
  const h = new Date(); h.setHours(0,0,0,0);
  let e = null; for(const w of ss){ const i=fechaIni(w.FECHAS); if(i && h>=i) e=w; }
  return e || ss[0];
}

   Hasta ahora la app solo sabia de "la semana de hoy" (S.semana) y en Mi plan
   las semanas siguientes eran un titulo y nada mas. Ahora hay UNA sola idea
   nueva: S.mirando, la semana que el cliente ha abierto para verla.
     - S.mirando vacio  -> se mira la de hoy y se puede anotar, como siempre.
     - S.mirando puesto -> se mira otra semana y la pantalla va en modo lectura.
   Todo lo que pinta una sesion pregunta a semanaVista() y a soloLectura(), asi
   que no hay una segunda pantalla paralela que mantener: es la misma. Lo que se
   anota sigue colgando SIEMPRE de S.semana (el identificador de cada serie lo
   da SEM()), y en modo lectura no se pinta nada que escriba. */
const semanaVista = () => S.mirando || S.semana;
const soloLectura = () => !!S.mirando;

  const f = ((S.d&&S.d.FICHA)||[]).find(x=>norm(x.CAMPO)===norm(k));
  if(!f || String(f.VISIBLE||'').toUpperCase()==='NO') return null;
  return f.CONTENIDO || null;
};

/* El idioma sale de la ficha del cliente. Antes de que llegue su plan no
   hay ficha, asi que se mira el enlace (&lang=en) y lo que se guardo la
   ultima vez: asi la pantalla de "cargando" y la de error ya salen bien. */
function enIngles(){
  const f = ajuste('idioma');
  if(f) return f.startsWith('en');
  return String(qs.get('lang') || LS.get('idioma','')).toLowerCase().startsWith('en');
}
const tr = s => (enIngles() && EN[s]) ? EN[s] : s;

const ajuste = k => {
  const f = ((S.d&&S.d.FICHA)||[]).find(x=>norm(x.CAMPO)===norm(k));
  return f ? norm(f.CONTENIDO) : '';
};
const diasDeBloque = b => (S.d.SEMANA||[]).filter(r=>r.BLOQUE===b);
const sesionDe = (b,d) => (S.d.SESIONES||[])
  .filter(r=>r.BLOQUE===b && norm(r['DÍA'])===norm(d))
  .sort((a,b2)=>(parseInt(a.ORDEN)||0)-(parseInt(b2.ORDEN)||0));
function diaDeHoy(b){
  const hs = hoyNombres();
  return diasDeBloque(b).find(d=>hs.some(h=>norm(d['DÍA']).startsWith(h))) || null;
}

/* --- Días fijos o sesiones libres ---------------------------------
   Alexia entrena lunes, martes, jueves y sábado: días fijos.
   Sergio elige el día según sus viajes: sus sesiones se llaman
   "Sesión 1..4". Si ninguna fila del bloque es un día de la semana,
   la app cambia a modo libre y él elige qué toca hoy.            */
const esDiaSemana = d => DIAS.concat(DIAS_EN).some(x=>norm(String(d)).startsWith(norm(x)));
/* Un día de descanso se llama "Descanso" o "Rest" según el idioma de la hoja. */
const esDescanso = d => { const t = norm(d && d['SESIÓN']); return t.includes('descanso') || /\b(rest|day off)\b/.test(t); };

/* PERFIL · se declara en la ficha, no se adivina.
     fijo     → entrena días concretos (lunes, martes...). Pantalla "Hoy toca X".
     flexible → elige el día de cada sesión. Pantalla "Te quedan estas sesiones".
   Si la ficha no lo dice, se deduce de los nombres de los días para no
   romper las hojas antiguas. */
function modoLibre(b){
  const p = ajuste('perfil');
  if(p==='flexible' || p==='libre') return true;
  if(p==='fijo') return false;
  const ds = diasDeBloque(b).filter(d=>!esDescanso(d));
  return ds.length>0 && !ds.some(d=>esDiaSemana(d['DÍA']));
}

/* Sesiones marcadas como opcionales: no cuentan para la adherencia.
   El "rodaje extra" de Sergio o un sábado suelto no deben salir como
   sesión fallada si no se hacen. */
const esOpcional = d => {
  const v = norm(d && (d.OPCIONAL || d.Opcional || ''));
  if(v==='si' || v==='sí' || v==='x' || v==='yes') return true;
  const t = norm(d && d['SESIÓN']);
  return t.includes('opcional') || t.includes('optional');
};
const idFecha = (b,d) => `${SEM()}~${slug(b)}~${slug(d)}~fecha`;
function fechaDe(b,d){ const v=LOG[idFecha(b,d)]; return v?v.fecha:''; }
function marcaFecha(b,d){
  const id=idFecha(b,d);
  if(LOG[id]) return;
  LOG[id]={fecha:new Date().toISOString().slice(0,10), ok:true};
  LS.set('log', LOG);
}
/* Sesiones de la semana que aún no se han registrado */
function pendientesSemana(b){
  return diasDeBloque(b)
    .filter(d=>!esDescanso(d))
    .filter(d=>['sin','parcial'].includes(estadoSesion(b,d['DÍA'])));
}
/* Las que cuentan para la adherencia: ni descansos ni opcionales */
const sesionesContables = b => diasDeBloque(b)
  .filter(d=>!esDescanso(d) && !esOpcional(d));
/* v4.4: cada uno escribe el semaforo a su manera. Carmen pone AMARILLO
   donde otros ponen AMBAR, y eso antes salia en gris, sin color. Se acepta
   como lo escriba la hoja: la palabra del cliente no se toca. */
const semColor = s => { const v = norm(s);
  return (v==='rojo'||v==='red') ? 'rojo'
       : (v==='ambar'||v==='amber'||v==='amarillo'||v==='yellow'||v==='naranja'||v==='orange') ? 'ambar'
       : (v==='verde'||v==='green') ? 'verde' : 'gris'; };
const semForma = s => { const v=semColor(s); return v==='rojo'?'■':v==='ambar'?'▲':v==='verde'?'●':'–'; };

/* Identificador estable de cada serie. Es lo que permite corregir
   un dato ya enviado en vez de duplicarlo en la hoja.
   v3.14: empieza por la semana. Un bloque dura varias semanas, asi que
   sin este prefijo el lunes de la semana 3 era el mismo lunes que el de
   la 2: se pisaban el registro y se perdia la progresion. */
const SEM = () => 's' + slug(String((S.semana && S.semana.SEMANA) || '0'));
const idSerie = (b,d,ej,i) => `${SEM()}~${slug(b)}~${slug(d)}~${slug(ej)}~s${i+1}`;
const idOmit  = (b,d) => `${SEM()}~${slug(b)}~${slug(d)}~omitida`;
const idObs   = (b,d) => `${SEM()}~${slug(b)}~${slug(d)}~obs`;
/* Nota del cliente sobre un ejercicio concreto: "no sé si lo hago bien",
   "me molesta el hombro"... Llega a la hoja con el nombre del ejercicio,
   así se sabe exactamente de cuál habla. */
const idNota  = (b,d,ej) => `${SEM()}~${slug(b)}~${slug(d)}~${slug(ej)}~nota`;
const idReg   = (b,d,ej) => `${SEM()}~${slug(b)}~${slug(d)}~${slug(ej)}~reg`;
const idVal   = (b,d)    => `${SEM()}~${slug(b)}~${slug(d)}~valoracion`;

/* v3.14: "la ultima vez". Busca el mismo ejercicio en cualquier semana
   anterior, o en otro dia de esta, y devuelve la serie mas pesada de la
   ultima sesion en la que se anoto. Si nunca se ha hecho, no devuelve nada
   y debajo del ejercicio no aparece ninguna linea. */
function ultimaVez(bl, dia, nombre){
  const ej = slug(nombre), hoy = SEM()+'~'+slug(bl)+'~'+slug(dia), cand = [];
  Object.keys(LOG).forEach(k=>{
    const p = k.split('~');
    if(p.length !== 5 || p[3] !== ej || !/^s\d+$/.test(p[4])) return;
    const v = LOG[k];
    if(!v || !v.ok || v.borrada || (!v.r && !v.c)) return;
    if(p[0]+'~'+p[1]+'~'+p[2] === hoy) return;          // la sesion de hoy no es "la ultima vez"
    cand.push({ses:p[0]+'~'+p[1]+'~'+p[2], sem:parseInt(p[0].replace(/^s/,''))||0, ts:v.ts||'',
               c:parseFloat(String(v.c||'').replace(',','.'))||0, carga:v.c||'', reps:v.r||'', rir:v.rir||''});
  });
  if(!cand.length) return null;
  cand.sort((a,b)=> b.sem-a.sem || (b.ts||'').localeCompare(a.ts||''));
  const ses = cand[0].ses;
  const mismas = cand.filter(x=>x.ses===ses)
    .sort((a,b)=> b.c-a.c || (parseFloat(b.reps)||0)-(parseFloat(a.reps)||0));
  return {sem:mismas[0].sem, carga:mismas[0].carga, reps:mismas[0].reps, rir:mismas[0].rir};
}
/* Lo mismo para lo que no son series: carrera, remo, trineo... */
function ultimaVezReg(bl, dia, nombre){
  const ej = slug(nombre), hoy = SEM()+'~'+slug(bl)+'~'+slug(dia), cand = [];
  Object.keys(LOG).forEach(k=>{
    const p = k.split('~');
    if(p.length !== 5 || p[3] !== ej || p[4] !== 'reg') return;
    const v = LOG[k]; if(!v || !v.ok || v.borrada || !v.d) return;
    if(p[0]+'~'+p[1]+'~'+p[2] === hoy) return;
    cand.push({sem:parseInt(p[0].replace(/^s/,''))||0, ts:v.ts||'', d:v.d});
  });
  if(!cand.length) return null;
  cand.sort((a,b)=> b.sem-a.sem || (b.ts||'').localeCompare(a.ts||''));
  const d = cand[0].d;
  const partes = [d.km?d.km+' km':'', d.tiempo||'', d.metros||'',
                  vamDe(d.vam)?'VAM '+paso(vamDe(d.vam))+' min/km':'', d.carga?d.carga+' kg':'',
                  d.rpe?'RPE '+d.rpe:''].filter(Boolean);
  return partes.length ? {sem:cand[0].sem, txt:partes.join(' · ')} : null;
}
function lineaUltima(u){
  if(!u) return '';
  const txt = u.txt ? u.txt
    : (u.carga ? u.carga+' kg × '+u.reps : u.reps+' '+tr('reps')) + (u.rir?' · RIR '+u.rir:'');
  return `<div class="ultima">${tr("La última vez")}${u.sem?' · '+tr('semana')+' '+u.sem:''}: <b>${esc(txt)}</b></div>`;
}

/* Que se pide en cada fila lo declara la hoja en la columna REGISTRO.
   Antes solo habia casillas donde habia SERIES, asi que una carrera o una
   ronda de HYROX no tenian donde anotarse. */
/* v5.2: cada casilla dice QUE se le pide y, cuando es una escala, que
   significan sus extremos. Antes ponia "piernas 1-5" y nadie sabia si 5
   eran las piernas frescas o destrozadas: ni siquiera coincidian entre si
   la app y el seguimiento. Decision de Salvador: 1 = frescas, 5 = destrozadas.
   "ayuda" es la linea pequena bajo la casilla; "escala" pinta botones. */
const CAMPOS = {
  km:      {et:'km de toda la sesión', ph:'5,2', modo:'decimal',
            ayuda:'de principio a fin, calentamiento y vuelta a la calma incluidos'},
  tiempo:  {et:'tiempo',      ph:'45:30',   modo:'text',
            ayuda:'45 son 45 min · 45:30 · 1:10:00'},
  rpe:     {et:'esfuerzo (1 al 10)', ph:'1-10', modo:'numeric',
            ayuda:'1 = paseando · 5 = frases enteras · 8 = frases cortas · 10 = a tope'},
  piernas: {et:'cómo quedaron las piernas', ph:'1-5', modo:'numeric', escala:5,
            ayuda:'1 = frescas · 5 = destrozadas'},
  carga:   {et:'carga',       ph:'kg',      modo:'decimal'},
  metros:  {et:'metros / reps',ph:'m o reps',modo:'text'},
  vam:     {et:'metros totales que marca la cinta al acabar', ph:'2150', modo:'decimal',
            ayuda:'con el kilómetro de calentamiento incluido'},
  ritmo:   {et:'ritmo o velocidad', ph:'5:30 min/km · 11 km/h', modo:'text',
            ayuda:'como te lo dé el reloj o la cinta; escribe la unidad'},
  fuel:    {et:'avituallamiento', ph:'lo tomé todo', modo:'text',
            ayuda:'dímelo sobre todo si te lo saltaste o te sentó mal'}
};
const camposDe = f => String((f&&f.REGISTRO)||'').split(',')
                        .map(x=>norm(x)).filter(k=>CAMPOS[k]);
/* Una casilla del bloque de registro. Las escalas salen como botones (se
   contestan de un toque y no hay que teclear), el resto como casilla de
   texto. Debajo, la linea de ayuda si la tiene. */
const ANCHAS = {vam:1, ritmo:1, fuel:1};
function casilla(rid, k, d, cs, nombre){
  const C = CAMPOS[k], val = String(d[k]||'');
  const ay = C.ayuda ? `<p class="ayuda">${esc(tr(C.ayuda))}</p>` : '';
  const ancho = (ANCHAS[k] || C.escala) ? ' ancho' : '';
  if(C.escala) return `<div class="c${ancho}"><label>${esc(tr(C.et))}</label>
    <div class="escala">${Array.from({length:C.escala},(_,i)=>i+1).map(n=>
      `<button type="button" class="${val===String(n)?'on':''}" id="eb_${rid}_${k}_${n}"
        onclick="anotaEscala('${rid}','${k}',${n})"
        aria-label="${esc(tr(C.et))} ${n} ${esc(nombre)}">${n}</button>`).join('')}</div>${ay}</div>`;
  return `<div class="c${ancho}"><label for="g_${rid}_${k}">${esc(tr(C.et))}</label>
    <input id="g_${rid}_${k}" inputmode="${C.modo}" placeholder="${esc(tr(C.ph))}"
      value="${esc(val)}" oninput="anotaReg('${rid}','${cs}')"
      aria-label="${esc(tr(C.et))} · ${esc(nombre)}">${ay}</div>`;
}

/* v5.2: que casillas salen en una carrera. No es lo mismo que esCarrera()
   (mas abajo), que decide la foto del reloj y deja fuera a proposito los
   calentamientos: aqui SI entran, porque los 15 min de Z2 de una vuelta a la
   calma son carrera que suma y hoy pedian kilos.
   Se mira el TIPO de la hoja, nunca el nombre: hay hojas donde la sesion de
   fuerza entera viene marcada como running. Y para QUITAR las casillas de
   kilos hace falta ademas que la dosis sea de tiempo o de distancia: un
   ejercicio de 10 reps dentro de un hibrido sigue siendo fuerza. */
const DOSIS_TIEMPO = /^\s*\d+([.,]\d+)?\s*(''|"|s|seg|segundos|sec|min|minutos|minutes|h|km|m|metros|mi|miles)\b/i;
const esCorrer = f => ['running','hibrido'].indexOf(norm(f && f.TIPO)) > -1;
const corrPorTiempo = f => esCorrer(f) && DOSIS_TIEMPO.test(String((f && f['REPS / DOSIS']) || ''));
const ABIERTAS = {};                       // series desplegadas, solo en esta visita
function abreSeries(id){ ABIERTAS[id] = !ABIERTAS[id]; pinta(); }

/* Filas de una carrera: tiempo y esfuerzo por serie. Nunca kilos. */
function setsCorre(bl, dia, nombre, series, hayTotales){
  const base = slug(bl)+'~'+slug(dia)+'~'+slug(nombre);
  const ids = Array.from({length:series},(_,i)=>idSerie(bl,dia,nombre,i));
  const conDatos = ids.some(id=>{ const v=LOG[id]||{}; return v.t || v.e; });
  const abierto = !hayTotales || conDatos || !!ABIERTAS[base];
  const filas = abierto ? `<div class="sets">${ids.map((id,i)=>{
      recordarNombre(id, nombre);
      const v = LOG[id] || {};
      return `<div class="set corre ${v.ok?'ok':''} ${v.sent?'sent':''}" id="fila_${id}">
        <span class="i">${series>1?i+1:'·'}</span>
        <input inputmode="text" placeholder="${tr('tiempo')}" value="${esc(v.t||'')}" id="t_${id}"
          oninput="anotaC('${id}')" aria-label="${tr('tiempo')} ${i+1} ${esc(nombre)}">
        <input inputmode="numeric" placeholder="${tr('esfuerzo')}" value="${esc(v.e||'')}" id="e_${id}"
          oninput="anotaC('${id}')" aria-label="${tr('esfuerzo (1 al 10)')} ${i+1}">
        <button id="b_${id}" onclick="confirmarC('${id}')">${tr(v.ok?'Hecha':'Anotar')}</button>
        <button class="x" onclick="vaciarC('${id}')" aria-label="${tr('Vaciar')}" title="${tr('Vaciar')}">✕</button>
      </div>`;}).join('')}</div>` : '';
  const boton = hayTotales
    ? `<div class="masseries"><button onclick="abreSeries('${base}')">${
        abierto ? tr('Ocultar las series') : tr('Anotar serie a serie (opcional)')}</button></div>`
    : '';
  return filas + boton;
}
function anotaC(id){
  const t=document.getElementById('t_'+id), e=document.getElementById('e_'+id);
  const prev = LOG[id] || {};
  LOG[id] = Object.assign({}, prev, {t:t?t.value.trim():'', e:e?e.value.trim():''});
  if(prev.sent) LOG[id].corregido = true;
  LS.set('log', LOG);
  const fila = document.getElementById('fila_'+id);
  if(fila && LOG[id].corregido) fila.classList.add('corr');
}
function confirmarC(id){
  const v = LOG[id] || {};
  if(v.ok){ LOG[id] = Object.assign({}, v, {ok:false}); }
  else {
    anotaC(id);
    if(!LOG[id].t && !LOG[id].e){ toast(tr('Anota al menos un dato antes de confirmar.')); return; }
    LOG[id].ok = true;
    LOG[id].ts = new Date().toISOString();
  }
  LS.set('log', LOG);
  const fila=document.getElementById('fila_'+id), btn=document.getElementById('b_'+id);
  if(fila) fila.classList.toggle('ok', !!LOG[id].ok);
  if(btn) btn.textContent = tr(LOG[id].ok ? 'Hecha' : 'Anotar');
}
function vaciarC(id){
  const v = LOG[id] || {};
  ['t_','e_'].forEach(p=>{ const el=document.getElementById(p+id); if(el) el.value=''; });
  if(v.sent){
    LOG[id] = {t:'', e:'', ok:false, sent:true, corregido:true, borrada:true};
    toast(tr('Se corregirá en la hoja al enviar.'));
  } else { delete LOG[id]; }
  LS.set('log', LOG);
  const fila=document.getElementById('fila_'+id), btn=document.getElementById('b_'+id);
  if(fila){ fila.classList.remove('ok'); if(LOG[id]) fila.classList.add('corr'); }
  if(btn) btn.textContent = tr('Anotar');
}

function aSegundos(t){
  const p = String(t||'').trim().split(':').map(x=>parseInt(x,10));
  if(!p.length || p.some(isNaN)) return 0;
  if(p.length===3) return p[0]*3600 + p[1]*60 + p[2];
  if(p.length===2) return p[0]*60 + p[1];
  return p[0]*60;                        // "45" se entiende como 45 minutos
}
function ritmoDe(d){
  const km = parseFloat(String((d&&d.km)||'').replace(',','.'));
  const sg = aSegundos(d&&d.tiempo);
  if(!km || !sg) return '';
  const s = Math.round(sg/km);
  return 'Ritmo ' + Math.floor(s/60) + ':' + String(s%60).padStart(2,'0') + ' min/km';
}
/* v5.0: el Test A de VAM, a la manera de Salva. Son 5 minutos en cinta que
   arrancan en el metro 1.000, porque el kilometro de calentamiento cuenta en la
   cinta. Se anotan los metros totales que marca al acabar, y la VAM es lo
   recorrido en esos 5 minutos por 12. Cada clienta tiene la suya: la app no
   mira la de nadie mas. Juntas se corre a la de la mas baja, y eso se decide
   en persona. */
const VAM_INICIO = 1000;
function vamDe(v){
  let m = parseFloat(String(v||'').replace(/\s/g,'').replace(',','.'));
  if(!m) return 0;
  if(m < 10) m = m*1000;                  // "2,15" o "2.150": lo escribio en km
  const x = (m - VAM_INICIO) * 12 / 1000;
  return (x >= 6 && x <= 26) ? Math.round(x*10)/10 : 0;
}
// El 1e-9 evita que 10,05 salga 10,0 por la coma flotante
const kmh = x => String(Math.round(x*10 + 1e-9)/10).replace('.', enIngles() ? '.' : ',');
/* v5.1: todo lo que se prescribe va en minutos por kilometro, no en km/h.
   Salvador lo pidio asi: es como lo leen ellas en el reloj. */
const paso = x => { const s = Math.round(3600/x);
                    return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); };
/* La ultima VAM anotada y confirmada, sea de la semana que sea */
function miVAM(){
  let mejor = null;
  Object.keys(LOG).forEach(k=>{
    const v = LOG[k];
    if(!v || !v.ok || v.borrada || !k.endsWith('~reg') || !v.d || !v.d.vam) return;
    const x = vamDe(v.d.vam); if(!x) return;
    if(!mejor || (v.ts||'') > mejor.ts) mejor = {v:x, ts:v.ts||''};
  });
  return mejor;
}
/* Lo que sale debajo de la casilla del test mientras se escribe */
function textoVAM(valor){
  if(!String(valor||'').trim()) return '';
  const x = vamDe(valor);
  if(!x) return tr('Revisa el dato: son los metros totales que marca la cinta al acabar, con el kilómetro de calentamiento (por ejemplo, 2150).');
  const s = [75, 79, 83].map(p=>paso(x*p/100)).join(' · ');
  return `${tr('Tu VAM')}: ${paso(x)} ${tr('min/km')} · ${tr('Tus 3 × 1 km')}: ${s} ${tr('min/km')}`;
}
/* "95 % de tu VAM" pasa a "95 % de tu VAM (4:35 min/km)" en cuanto hay VAM.
   Vale para rangos: "60-70 % de tu VAM" da "de 7:15 a 6:13 min/km". */
function conVAM(t){
  const x = miVAM(); if(!x || !t) return t;
  return String(t).replace(/(\d+)(?:\s*[-–]\s*(\d+))?\s*%\s*de tu VAM/gi,
    (m, a, b) => m + ' (' + (b ? tr('de') + ' ' + paso(x.v*a/100) + ' ' + tr('a') + ' ' + paso(x.v*b/100)
                               : paso(x.v*a/100)) + ' ' + tr('min/km') + ')');
}
const textoNota = id => { const v=LOG[id]; return v && v.nota ? v.nota : ''; };
/* El identificador lleva el nombre en minúsculas y con guiones, pero a la
   hoja debe llegar tal y como tú lo escribiste. Se recuerda al pintar. */
const NOMBRES = {};
const recordarNombre = (id, nombre) => { if(nombre) NOMBRES[id]=nombre; };
const nombreDe = id => NOMBRES[id] || '';
const idChk   = (sem,n) => `chk~s${slug(sem)}~p${slug(n)}`;
const idVideo = (b,d,n) => `${SEM()}~${slug(b)}~${slug(d)}~${slug(n)}~vid`;
const idFoto  = (b,d,n) => `${SEM()}~${slug(b)}~${slug(d)}~${slug(n)}~foto`;
/* v3.19: "este ejercicio no lo he hecho". Sin esto, una sesion en la que
   se salta un ejercicio se quedaba en "Parcial" para siempre. */
const idSalto = (b,d,n) => `${SEM()}~${slug(b)}~${slug(d)}~${slug(n)}~salto`;
/* v3.21: entrenamientos que ha hecho por su cuenta y no estaban en el plan
   (una clase de pilates, un HYROX en grupo, un partido). Se apuntan en el
   dia que toque y quedan en la hoja, para saber que hace de verdad. */
const idExtra = (b,d,n) => `${SEM()}~${slug(b)}~${slug(d)}~extra-${n}~extra`;
function extrasDe(b,d){
  const pre = `${SEM()}~${slug(b)}~${slug(d)}~extra-`;
  return Object.keys(LOG).filter(k=>k.indexOf(pre)===0 && k.endsWith('~extra') && LOG[k] && !LOG[k].borrada)
    .sort().map(k=>({id:k, v:LOG[k].extra || {}}));
}
const saltado = (b,d,n) => { const v = LOG[idSalto(b,d,n)]; return !!(v && v.ok); };
const hoyISO  = () => new Date().toISOString().slice(0,10);

/* ---------- biblioteca de ejercicios ---------- */
const fichaEj = nombre => (S.d.EJERCICIOS||[]).find(e=>norm(e.EJERCICIO)===norm(nombre)) || null;
function idYoutube(url){
  const m = String(url||'').match(/(?:shorts\/|watch\?v=|youtu\.be\/|embed\/)([A-Za-z0-9_-]{6,})/);
  return m ? m[1] : null;
}

/* ---------- estado de sesión ---------- */
function estadoSesion(b,d){
  if(LOG[idOmit(b,d)]) return 'omitida';
  const todas = sesionDe(b,d).filter(f=>parseInt(f.ORDEN)>0 && !esExtra(f)
                                        && !saltado(b,d,f['EJERCICIO / ELEMENTO']));
  /* v4.8: si un elemento trae SERIES y ademas casillas de carrera, manda la
     carrera. Un "5 x 250 m de SkiErg" se mide en tiempo y RPE, no en kilos:
     las filas de reps/kg/RIR ahi no pintan nada. Antes salian las dos cosas y,
     peor, solo contaban las series: quien rellenaba el tiempo dejaba la sesion
     en "parcial" para siempre. */
  const conReg    = todas.filter(f=>camposDe(f).length);
  const conSeries = todas.filter(f=>!camposDe(f).length && f.SERIES);
  if(!conSeries.length && !conReg.length){
    // Una carrera larga puede no tener nada que anotar. Antes se quedaba
    // "sin registrar" para siempre y nunca contaba como hecha: ahora basta
    // con valorarla al terminar.
    const val = LOG[idVal(b,d)];
    return (val && val.val) ? 'hecha' : 'sin';
  }
  /* v3.19: la sesion esta HECHA cuando todos los ejercicios tienen algo
     anotado, aunque falte alguna serie suelta. Antes hacia falta que
     cuadraran todas las series: bastaba con hacer 3 de 4 para que la
     sesion se quedara en "Parcial" toda la vida. PARCIAL ahora significa
     lo que de verdad importa: hay ejercicios sin tocar. El detalle serie
     a serie sigue entero en la hoja. */
  let ejercicios=0, conAlgo=0, anotadas=0;
  conSeries.forEach(f=>{
    const n = parseInt(f.SERIES)||1; ejercicios++;
    let m = 0;
    for(let i=0;i<n;i++){ const v=LOG[idSerie(b,d,f['EJERCICIO / ELEMENTO'],i)]; if(v && v.ok) m++; }
    anotadas += m; if(m) conAlgo++;
  });
  conReg.forEach(f=>{
    ejercicios++;
    const v = LOG[idReg(b,d,f['EJERCICIO / ELEMENTO'])];
    if(v && v.ok){ anotadas++; conAlgo++; }
  });
  if(!anotadas) return 'sin';
  return conAlgo >= ejercicios ? 'hecha' : 'parcial';
}
const ETQ = {sin:['gris','Sin registrar'], parcial:['ambar','Parcial'], hecha:['verde','Registrada'], omitida:['rojo','Omitida']};
const chipEstado = e => { const [c,t]=ETQ[e]||ETQ.sin; return `<span class="sem ${c}"><i>${semForma(c)}</i>${tr(t)}</span>`; };
const pendientes = () => Object.keys(LOG).filter(k=>LOG[k] && LOG[k].ok && !LOG[k].sent).length;

/* ---------- aviso de seguimiento ---------- */
function faltaCheckin(){
  const ss = S.d.SEMANAS||[]; if(!S.semana || !ss.length) return null;
  const i = ss.findIndex(w=>w.SEMANA===S.semana.SEMANA);
  if(i<=0) return null;                                  // en la semana 1 no hay anterior
  const ant = ss[i-1];
  if(ENVIADO.includes(String(ant.SEMANA))) return null;
  // Si ya está respondida en la hoja, tampoco avisamos: así el aviso no
  // reaparece por cambiar de móvil o vaciar el navegador.
  const enHoja = (S.d.MIS_SEMANAS_CHECKIN||[]).map(String);
  if(enHoja.includes(String(ant.SEMANA))){
    if(!ENVIADO.includes(String(ant.SEMANA))){ ENVIADO.push(String(ant.SEMANA)); LS.set('semanas_enviadas', ENVIADO); }
    return null;
  }
  return ant;
}

/* ---------- carga ---------- */
async function cargar(){
  if(!CID || !KEY){ S.err=tr('Te falta parte del enlace. Abre entero el que te mandó Salva.'); pinta(); return; }
  if(!S.d){
    const c = LS.get('plan', null);
    if(c && c.d){ S.d=c.d; S.semana=semanaActual(); migrarSemana(); S.cache=c.ts; pinta(); }
  }
  // Sin límite de espera, una petición que no responde deja la pantalla
  // en "Cargando..." para siempre. 25 s y se avisa con un botón.
  const ctrl = new AbortController();
  const reloj = setTimeout(()=>ctrl.abort(), 25000);
  try{
    // El parametro NO puede llamarse "c": Google devuelve error 400 en
    // cualquier direccion de Apps Script que lleve ?c=. En el enlace de la
    // app si vale, porque ese no pasa por Google.
    const r = await fetch(API + '?cliente=' + encodeURIComponent(CID) + '&k=' + encodeURIComponent(KEY),
                          {redirect:'follow', signal:ctrl.signal});
    clearTimeout(reloj);
    const d = await r.json();
    if(d.error) throw new Error(d.error);
    S.d=d; S.semana=semanaActual(); migrarSemana(); S.err=null; S.cache=null;
    LS.set('idioma', ajuste('idioma') || 'es');   // para la pantalla de carga de la proxima vez
    LS.set('plan', {d:d, ts:Date.now()});
    fusionarRegistros(d.MIS_REGISTROS||[]);
  }catch(e){
    clearTimeout(reloj);
    const tardo = e && e.name==='AbortError';
    if(!S.d) S.err = tardo ? tr('El plan está tardando más de lo normal.')
                           : (e.message || 'No se ha podido cargar el plan');
  }
  pinta();
}

/* v3.14: lo anotado antes de esta version no llevaba la semana delante.
   Se le pone la semana en la que esta hoy: es de donde viene, porque
   hasta ahora cada bloque solo podia guardar una tanda. Asi no pierde
   las sesiones que ya tenia marcadas. */
function migrarSemana(){
  if(LS.get('migrado_semana', false)) return;
  /* Un identificador nuevo empieza por la semana; los viejos empezaban por
     el bloque. No vale mirar si empieza por "s" y un numero, porque hay
     clientes cuyo bloque se llama S01: hay que contar las partes.
     Las marcas de dia (omitida, obs, valoracion, fecha) tienen 4 partes
     nuevas y 3 viejas; todo lo demas, 5 nuevas y 4 viejas. */
  const MARCAS = ['omitida','obs','valoracion','fecha'];
  const semDe = b => {
    // Si ese bloque es de una sola semana, es esa. Si dura varias (no se
    // puede saber cual), la semana en la que esta hoy.
    const ss = (S.d.SEMANAS||[]).filter(w=>slug(w['BLOQUE (apunta a SESIONES)'] || w.BLOQUE || '') === b);
    return ss.length === 1 ? 's' + slug(String(ss[0].SEMANA)) : SEM();
  };
  const pasa = o => {
    const n = {};
    Object.keys(o).forEach(k=>{
      const p = k.split('~');
      const esperadas = MARCAS.indexOf(p[p.length-1]) > -1 ? 4 : 5;
      n[p.length < esperadas ? semDe(p[0]) + '~' + k : k] = o[k];
    });
    return n;
  };
  LOG = pasa(LOG); LS.set('log', LOG);
  VID = pasa(VID); LS.set('videos', VID);
  LS.set('migrado_semana', true);
}

/* Trae de la hoja lo ya enviado, para que se pueda repasar y corregir
   aunque la clienta haya cambiado de móvil o vaciado el navegador. */
function fusionarRegistros(filas){
  let cambios = false;
  filas.forEach(f=>{
    const id = f.ID; if(!id) return;
    // Las omisiones no se traen de la hoja: son una marca del momento y,
    // si la persona omitio y luego entreno igual, taparia la sesion buena.
    if(String(id).endsWith('~omitida')) return;
    if(!LOG[id]){
      if(id.endsWith('~extra')){
        const tit = String(f.EJERCICIO||'').replace(/^EXTRA\s*·\s*/,'');
        if(tit) LOG[id] = {extra:{titulo:tit, min:String(f.TIEMPO||'').replace(/\s*min$/,''),
                                  int:parseInt(f.RPE)||0, nota:f.NOTAS||''}, ok:true, sent:true};
      } else if(id.endsWith('~salto')){
        if(String(f.ESTADO||'').toLowerCase() === 'omitida') LOG[id] = {salto:true, ok:true, sent:true};
      } else if(id.endsWith('~reg')){
        // v5.0: el test de VAM viaja en REPS, con "VAM" en RITMO para reconocerlo
        const esVAM = /^VAM\b/.test(String(f.RITMO||''));
        LOG[id] = {d:{km:f.KM||'', tiempo:f.TIEMPO||'', rpe:f.RPE||'', piernas:f.PIERNAS||'',
                      carga:f.CARGA||'', metros:esVAM?'':(f.REPS||''), vam:esVAM?String(f.REPS||''):''},
                   ok:true, sent:true, ts:f.FECHA||''};
      } else if(id.endsWith('~valoracion')){
        LOG[id] = {val:parseInt(f.VALORACION)||0, ok:true, sent:true};
      } else {
        LOG[id] = {r:f.REPS||'', c:f.CARGA||'', rir:f.RIR||'', ok:true, sent:true, ts:f.FECHA||'',
                   est:f.ESTADO||'', obs:f.NOTAS||'', nota:f.NOTAS||''};
      }
      cambios = true;
    }
  });
  if(cambios) LS.set('log', LOG);
}
/* ============ pintado ============ */
function pinta(){
  const app = document.getElementById('app');
  // Si la pagina se declara en espanol, Chrome le ofrece "traducir del
  // espanol" a quien la tiene en ingles y estropea el texto.
  try { document.documentElement.lang = enIngles() ? 'en' : 'es'; } catch(e){}
  if(S.err && !S.d){ app.innerHTML = vErr(); return; }
  if(!S.d){ app.innerHTML = '<div class="load"><div class="spin"></div>'+tr("Cargando tu plan…")+'</div>'; return; }
  const v = {hoy:vHoy, plan:vPlan, semana:vSemana, sesion:vSesion, progreso:vProgreso, seguimiento:vSeg, guias:vGuias}[S.vista] || vHoy;
  app.innerHTML = cabecera() + '<main>' + v() + '</main>' + nav() +
    (S.toast?`<div class="toast">${esc(S.toast)}</div>`:'');
}
function vErr(){
  return `<div class="top"><div class="rowt"><div class="wm">SALVA</div></div></div>

  <button class="btn big" style="margin-top:14px" onclick="cargar()">${tr("Reintentar")}</button></div></main>`;
}
function cabecera(){
  const s = S.semana;
  return `<div class="top"><div class="rowt">
    <div><div class="wm">SALVA</div><div class="nm">${esc(campo('nombre') || (S.d && S.d.NOMBRE) || '')}</div></div>
    ${s?`<span class="pill">${tr('Semana')} ${esc(s.SEMANA)} ${tr('de')} ${(S.d.SEMANAS||[]).length}</span>`:''}

}
function nav(){
  const it = [['hoy','Hoy','◱'],['plan','Mi plan','▤'],['sesion','Registro','✓'],['progreso','Progreso','◔']];
  return `<nav>${it.map(([k,n,g])=>
    `<button onclick="ir('${k}')" ${S.vista===k?'aria-current="page"':''}><span class="g">${g}</span>${tr(n)}</button>`).join('')}</nav>`;
}
function ir(v){
  // Los cuatro botones de abajo son "el presente": al tocarlos se sale de la
  // semana que se estaba mirando.
  if(v!=='semana') S.mirando = null;
  S.vista=v; if(v!=='sesion') S.dia=null; S.video=null; window.scrollTo(0,0); pinta();
}
/* Abre una semana para verla. Si es la de hoy, no hay modo lectura: se va a Hoy. */
function verSemana(num){
  const w = (S.d.SEMANAS||[]).find(x=>String(x.SEMANA)===String(num));
  if(!w) return;
  if(S.semana && String(w.SEMANA)===String(S.semana.SEMANA)){ ir('hoy'); return; }
  S.mirando = w; S.dia = null; S.vista = 'semana'; S.video = null;
  window.scrollTo(0,0); pinta();
}

/* v3.14: las semanas se agrupan por bloque, y cada bloque lleva su
   titulo y para que sirve. Antes salia una lista de once semanas sin
   separacion y no se entendia que el bloque cambia el objetivo. */
function porBloques(){
  const g = [];
  (S.d.SEMANAS||[]).forEach(s=>{
    const b = s['BLOQUE (apunta a SESIONES)'] || s.BLOQUE || '';
    let x = g.find(y=>y.b===b);
    if(!x){ x = {b:b, semanas:[]}; g.push(x); }
    x.semanas.push(s);
  });
  return g;
}
/* El texto de cada bloque esta en TEXTOS con la clave intro_b1, intro_w11...
   Se busca por esa clave; si no cuadra, por el titulo. */
function introDe(bl){
  const ts = (S.d.TEXTOS||[]).filter(t=>norm(t.CLAVE).startsWith('intro'));
  const tok = norm(String(bl).split('·')[0]).replace(/\s+/g,'');
  return ts.find(t=>norm(t.CLAVE).replace(/^intro[_-]?/,'')===tok)
      || ts.find(t=>tok && norm(t['TÍTULO']).replace(/\s+/g,'').includes(tok))
      || null;
}
